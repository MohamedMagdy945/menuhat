<!-- GLOBAL LOADING OVERLAY -->
@if (loadingService.isLoading()) {
<div class="fixed inset-0 z-9999 flex items-center justify-center backdrop-blur-[2px] transition-all duration-300"
 >

    <!-- Card Container -->
    <div class="relative flex flex-col items-center justify-center text-center p-3 rounded-2xl">

        <!-- 7-Segment Thin Arc Loader Container -->
        <div class="thin-segmented-loader mb-5">

            <!-- SVG with 7 Arc Line Segments (3px gap) -->
            <svg class="loader-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g class="arcs-container">
                    <!-- 7 Curved Segments separated by 3px gap -->
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(0 100 100)" />
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(51.43 100 100)" />
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(102.86 100 100)" />
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(154.29 100 100)" />
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(205.71 100 100)" />
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(257.14 100 100)" />
                    <path class="arc-segment" d="M 68.38 30.89 A 76 76 0 0 1 131.62 30.89"
                        transform="rotate(308.57 100 100)" />
                </g>
            </svg>

            <!-- Center Logo inside the circular ring -->
            <img src="/icons/small-logo.png" alt="Menuhat Logo" class="center-logo">
        </div>

    </div>

</div>
}
