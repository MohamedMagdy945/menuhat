<!-- GLOBAL LOADING OVERLAY -->
@if (loadingService.isLoading()) {
<div class="fixed inset-0 z-9999 flex items-center justify-center bg-black/10 backdrop-blur-[2px] transition-all duration-300"
    dir="rtl">

    <!-- Card Container -->
    <div class="relative flex flex-col items-center justify-center text-center">

        <!-- 8-Segment Thin Arc Loader Container -->
        <div class="thin-segmented-loader mb-5">

            <!-- SVG with 8 Arc Line Segments (4px gap) -->
            <svg class="loader-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g class="arcs-container">
                    <!-- 8 Curved Segments separated by ~4px gap -->
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(22.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(67.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(112.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(157.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(202.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(247.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(292.5 100 100)" />
                    <path class="arc-segment" d="M 73.88 28.63 A 76 76 0 0 1 126.12 28.63"
                        transform="rotate(337.5 100 100)" />
                </g>
            </svg>

            <!-- Center Logo inside the circular ring -->
            <img src="/icons/small-logo.png" alt="Menuhat Logo" class="center-logo">
        </div>

    </div>

</div>
}
