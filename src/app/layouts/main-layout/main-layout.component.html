<app-desktop-navbar />

<app-mobile-navbar />


<!-- Location Selector Button in Navbar -->
<button (click)="onFetchLocation()" [disabled]="isLoading()"
    class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors focus:outline-none disabled:opacity-60 cursor-pointer"
    title="اضغط لتحديث موقع التوصيل">
    <!-- Pin Icon / Loading Spinner -->
    @if (isLoading()) {
    <span class="animate-spin text-orange-500 text-lg">⌛</span>
    } @else {
    <span class="text-orange-500 text-xl">📍</span>
    }

    <div class="flex flex-col text-right">
        <span class="text-[10px] text-gray-400 font-medium leading-none">موقع التوصيل</span>
        <div class="flex items-center gap-1 font-bold text-xs sm:text-sm text-gray-800 mt-1">
            <span class="truncate max-w-[120px] sm:max-w-[180px]">{{ currentAddress() }}</span>
            <span class="text-[9px] text-gray-500">▼</span>
        </div>
    </div>
</button>

<main>
    <router-outlet />
</main>

<app-footer></app-footer>
