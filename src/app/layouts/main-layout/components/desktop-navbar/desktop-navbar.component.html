<!-- navbar.component.html -->
<nav class="hidden md:block px-6 w-full bg-white bg-surface" dir="rtl">

    <!-- Top Row -->
    <div class="flex items-center justify-between  py-3 gap-4">

        <!-- Logo (right side in RTL) -->
        <a routerLink="/" class="inline-flex items-center gap-3 decoration-0 focus:outline-none shrink-0">
            <!-- SVG Logo from Assets -->
            <img src="/icons/menuhat-logo.svg" alt="Menuhat Logo" class="h-12 w-auto object-contain" />
        </a>

        <!-- Vertical Divider Line -->
        <div class="self-stretch w-[2px] bg-gray-300 mx-2 shrink-0 "></div>
        <!-- Location -->
        <app-location-selector></app-location-selector>

        <!-- Search Bar -->
        <div dir="ltr"
            class="flex items-center flex-1 max-w-xl border border-border rounded-md overflow-hidden shadow-sm">

            <button
                class="bg-primary text-white px-4 py-2 text-sm font-semibold shrink-0 hover:bg-orange-500 transition-colors">
                بحث
            </button>

            <input type="text" dir="rtl" placeholder="ابحث عن المطاعم، الوجبات..."
                class="bg-background flex-1 px-3 py-2 text-sm text-right  outline-none text-text placeholder-gray-400" />

            <button class="bg-background px-3 py-2 text-gray-400 hover:text-primary transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
                </svg>
            </button>

        </div>

        <div class="flex items-center gap-3 shrink-0">

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />

                <!-- Small Orange Dot Badge -->
                <span class="absolute top-2 right-2 w-2 h-2 bg-orange-500 rounded-full border border-slate-100"></span>
            </button>

            <!-- Wishlist Icon -->
            <button
                class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />

            </button>

            <!-- Cart Icon -->
            <button
                class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />

            <button

                EN
            </button>

            <!-- Account Button (Pill Container with Orange Icon) -->
            <button routerLink="/login"
                class="flex items-center gap-2 pl-4 pr-1.5 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                </div>
                <span class="text-sm font-semibold text-slate-700">حسابي</span>
            </button>

        </div>
