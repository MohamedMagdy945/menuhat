<div class="min-h-screen bg-background text-slate-800 antialiased flex flex-col relative">
  <!-- 1. Full-Width Top Header (Spans edge-to-edge across the entire screen) -->
  <app-dashboard-header class="sticky top-0 z-50 w-full" />

  <!-- 2. Body Container below Header -->
  <div class="flex flex-1 relative">
    <!-- Sidebar Component (Positioned directly under the header at top-20) -->
    <app-dashboard-sidebar />

    <!-- Main Dynamic Content (Router Outlet) with margin for sidebar -->
    <main
      class="flex-1 p-4 sm:p-6 lg:p-8 w-full transition-all duration-300 flex flex-col items-center"
      [class.lg:mr-68]="!isCollapsed()"
      [class.lg:mr-20]="isCollapsed()"
    >
      <div class="w-full max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>

  </div>
</div>
