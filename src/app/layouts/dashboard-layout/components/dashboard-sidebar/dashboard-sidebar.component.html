<!-- Backdrop for Mobile -->
@if (isMobileOpen()) {
  <div
    class="fixed inset-0 z-30 bg-slate-900/50 lg:hidden"
    (click)="closeMobile()"
    aria-hidden="true"
  ></div>
}

<!-- Full Dashboard Sidebar Container (Full Height inset-y-0) -->
<aside
  class="fixed inset-y-0 right-0 z-40 flex flex-col w-68 bg-white select-none max-lg:shadow-xl"
  [class.max-lg:hidden]="!isMobileOpen()"
  aria-label="Main Navigation"
>
  <!-- Sidebar Brand Header -->
  <div class="h-18 px-4 border-b border-gray-100 flex items-center justify-between shrink-0">
    <a routerLink="/dashboard" class="flex items-center gap-2.5">
      <div
        class="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center shadow-xs"
      >
        <span class="material-symbols-sharp text-2xl" aria-hidden="true">restaurant</span>
      </div>
      <div class="flex flex-col min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="font-bold text-base text-slate-900 tracking-tight">مِنيوهات</span>
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-orange-100 text-orange-700">لوحة الإدارة</span>
        </div>
        <span class="text-xs text-slate-400 font-medium truncate">{{ restaurantName() }}</span>
      </div>
    </a>

    <!-- Mobile Close Button -->
    <button
      type="button"
      (click)="closeMobile()"
      class="lg:hidden p-1.5 rounded-lg text-slate-400 cursor-pointer"
      aria-label="إغلاق القائمة"
    >
      <span class="material-symbols-sharp text-xl">close</span>
    </button>
  </div>

  <!-- Scrollable Navigation (Flat List without Grouping) -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden p-3 custom-scroll" aria-label="Dashboard Menu">
    <ul class="flex flex-col gap-1 p-0 m-0 list-none" role="list">
      @for (item of navItems; track item.id) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            (click)="closeMobile()"
            class="main-nav-item"
          >
            <span class="material-symbols-sharp main-nav-icon" aria-hidden="true">
              {{ item.icon }}
            </span>
            <span class="main-nav-label">{{ item.label }}</span>

            @if (item.hasLiveIndicator) {
              <span class="live-indicator" title="حالة حية"></span>
            }

            @if (item.badge) {
              <span
                class="main-nav-badge"
                [class.badge-warning]="item.badgeVariant === 'warning'"
                [class.badge-info]="item.badgeVariant === 'info'"
                [class.badge-danger]="item.badgeVariant === 'danger'"
                [class.badge-success]="item.badgeVariant === 'success'"
              >
                {{ item.badge }}
              </span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- User Profile & Quick Info Footer -->
  <footer class="p-3 border-t border-gray-100 bg-slate-50/70 shrink-0">
    <div class="flex items-center gap-3 p-2.5 rounded-xl bg-white border border-gray-100 shadow-xs">
      <!-- User Avatar -->
      <div class="relative shrink-0">
        <div
          class="w-10 h-10 rounded-full bg-orange-500 text-white font-bold text-sm flex items-center justify-center shadow-xs"
        >
          AM
        </div>
        <span class="absolute bottom-0 left-0 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-white"></span>
      </div>

      <!-- User Text Details -->
      <div class="flex flex-col min-w-0 flex-1">
        <span class="text-sm font-semibold text-slate-800 truncate">{{ userProfile.name }}</span>
        <span class="text-xs text-slate-400 truncate">{{ restaurantName() }}</span>
      </div>

      <!-- Quick Logout Button -->
      <a
        routerLink="/login"
        class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 shrink-0 cursor-pointer"
        aria-label="تسجيل الخروج"
        title="تسجيل الخروج"
      >
        <span class="material-symbols-sharp text-[20px]">logout</span>
      </a>
    </div>
  </footer>
</aside>
