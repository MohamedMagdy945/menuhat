<header
  class="h-20 w-full bg-white border-b border-gray-100 px-4 sm:px-6 flex items-center justify-between"
  dir="rtl"
>
  <!-- Right Section: Brand Logo + Search -->
  <div class="flex items-center gap-4 flex-1 max-w-2xl">
    <!-- Mobile Hamburger Toggle -->
    <button
      type="button"
      (click)="toggleMobileSidebar()"
      class="lg:hidden p-2 rounded-xl text-slate-600 bg-slate-100 cursor-pointer"
      aria-label="فتح القائمة"
    >
      <span class="material-symbols-sharp text-2xl">menu</span>
    </button>

    <!-- Brand Header -->
    <a routerLink="/dashboard" class="flex items-center gap-3 shrink-0">
      <div
        class="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center shrink-0 shadow-sm"
      >
        <span class="material-symbols-sharp text-2xl" aria-hidden="true">restaurant</span>
      </div>
      <div class="hidden sm:flex flex-col min-w-0">
        <div class="flex items-center gap-2">
          <span class="font-bold text-base text-slate-900 tracking-tight">مِنيوهات</span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-orange-100 text-orange-700">لوحة الإدارة</span>
        </div>
        <span class="text-xs text-slate-400 font-medium truncate">{{ restaurantName() }}</span>
      </div>
    </a>

    <!-- Divider -->
    <div class="hidden md:block h-6 w-px bg-gray-200 mx-1"></div>

    <!-- Global Dashboard Search -->
    <div class="relative w-full max-w-md hidden sm:block">
      <input
        type="text"
        placeholder="بحث في الطلبات، الوجبات، العملاء..."
        class="w-full py-2 pr-10 pl-4 bg-slate-50 text-slate-800 placeholder-slate-400 text-sm rounded-xl border border-gray-200 focus:border-orange-500 focus:bg-white focus:outline-none"
      />
      <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
        <span class="material-symbols-sharp text-[20px]">search</span>
      </div>
    </div>
  </div>

  <!-- Left Section (Operational Status & Quick Actions) -->
  <div class="flex items-center gap-2.5">
    <!-- Live Operational Status Switch -->
    <button
      type="button"
      (click)="toggleRestaurantStatus()"
      class="flex items-center gap-2 py-1.5 px-3 rounded-xl border cursor-pointer"
      [class.bg-emerald-50]="isRestaurantOpen()"
      [class.border-emerald-200]="isRestaurantOpen()"
      [class.text-emerald-700]="isRestaurantOpen()"
      [class.bg-slate-100]="!isRestaurantOpen()"
      [class.border-slate-300]="!isRestaurantOpen()"
      [class.text-slate-600]="!isRestaurantOpen()"
    >
      <span
        class="inline-flex rounded-full h-2 w-2"
        [class.bg-emerald-500]="isRestaurantOpen()"
        [class.bg-slate-400]="!isRestaurantOpen()"
      ></span>
      <span class="text-xs font-semibold whitespace-nowrap">
        {{ isRestaurantOpen() ? 'مفتوح الآن' : 'مغلق مؤقتاً' }}
      </span>
    </button>

    <!-- Public Store Preview Button -->
    <a
      routerLink="/"
      class="hidden md:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white border border-gray-200 text-slate-700 font-semibold text-xs cursor-pointer"
    >
      <span class="material-symbols-sharp text-[18px]">storefront</span>
      <span>عرض المتجر</span>
    </a>

    <!-- Notifications Bell -->
    <button
      type="button"
      class="relative w-9 h-9 rounded-xl bg-slate-50 border border-gray-200 flex items-center justify-center text-slate-600 cursor-pointer"
      aria-label="التنبيهات"
    >
      <span class="material-symbols-sharp text-[20px]">notifications</span>
      <span class="absolute top-1.5 left-1.5 w-2 h-2 bg-orange-500 rounded-full"></span>
    </button>
  </div>
</header>
