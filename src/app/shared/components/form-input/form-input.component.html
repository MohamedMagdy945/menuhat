<div class="form-group" dir="rtl">
  @if (label()) {
    <div class="label-row">
      <label [for]="id() || null" class="form-label">
        {{ label() }}
      </label>
      <ng-content select="[label-extra]" />
    </div>
  }

  <div
    class="input-wrapper"
    [class.has-error]="isInvalid"
    [class.is-valid]="isValid"
  >
    <span class="input-icon leading-icon">
      <ng-content select="[input-icon]" />
    </span>

    <input
      [id]="id() || null"
      [type]="isPasswordType ? (showPassword ? 'text' : 'password') : type()"
      [value]="value"
      [disabled]="disabled"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
      class="form-input"
      [class.password-input]="isPasswordType"
    />

    @if (isPasswordType) {
      <button
        type="button"
        (click)="togglePassword()"
        class="toggle-password-btn"
        [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
      >
        <span class="material-symbols-sharp select-none leading-none text-[20px]">
          {{ showPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </button>
    }
  </div>

  <!-- Single Validation Error Message -->
  @if (isInvalid && resolvedError) {
    <div class="error-feedback">
      <span class="material-symbols-sharp select-none leading-none text-[16px] text-red-500">
        error
      </span>
      <span>{{ resolvedError }}</span>
    </div>
  }
</div>
