<button (click)="onSelectLocation()" [disabled]="isLoading()" type="button"
    class="flex items-center gap-1.5 text-sm text-text shrink-0 p-1.5 rounded-lg hover:bg-gray-50 transition-colors focus:outline-none disabled:opacity-60 cursor-pointer"
    title="اضغط لتحديث موقع التوصيل">
    <!-- Loading Spinner OR Location Pin Icon -->
    @if (isLoading()) {
    <svg class="w-4 h-4 text-primary animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
    </svg>
    } @else {
    <svg class="w-4 h-4 text-primary shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
    </svg>
    }

    <!-- Address Text Section -->
    <div class="leading-tight text-right">
        <div class="text-xs text-gray-400">موقع التوصيل</div>
        <div class="font-semibold text-text flex items-center gap-1">
            <span class="truncate max-w-[120px] sm:max-w-[180px]">
                {{ displayAddress() }}
            </span>
            <span class="text-[9px] text-gray-400">▼</span>
        </div>
    </div>
</button>
