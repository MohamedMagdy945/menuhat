<div class="w-full">
  <!-- Viewport: content spans the full container width; arrows float over its edges -->
  <div class="relative w-full">
    <!-- Right Arrow Button (>) -->
    @if (showArrows()) {
    <button
      type="button"
      [attr.aria-label]="isRtl() ? 'السابق' : 'التالي'"
      [disabled]="rightDisabled()"
      (click)="onRightArrowClick()"
      [class.invisible]="!canScroll() && !moreComing()"
      [class.pointer-events-none]="!canScroll() && !moreComing()"
      class="hidden md:flex absolute right-1 top-1/2 -translate-y-1/2 z-10 h-9 w-9 items-center justify-center rounded-full bg-white shadow-md border border-gray-100 text-gray-600 disabled:opacity-0 disabled:pointer-events-none cursor-pointer focus:outline-none transition-opacity"
    >
      <span class="material-symbols-sharp select-none text-[26px] leading-none">chevron_right</span>
    </button>
    }

    <!-- Scrollable Content Container -->
    <div
      #scrollContainer
      class="@container scrollbar-hide w-full min-w-0 flex overflow-x-auto scroll-smooth snap-x snap-proximity py-2 select-none"
      style="overflow-anchor: none; container-type: inline-size; -webkit-overflow-scrolling: touch"
      [dir]="isRtl() ? 'rtl' : 'ltr'"
      (scroll)="onScroll()"
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp()"
      (mouseleave)="onMouseUp()"
    >
      <div
        class="carousel-track"
        [class.has-grid]="hasExplicitItems()"
        [style]="trackStyle()"
      >
        <ng-content />
      </div>
    </div>

    <!-- Left Arrow Button (<) -->
    @if (showArrows()) {
    <button
      type="button"
      [attr.aria-label]="isRtl() ? 'التالي' : 'السابق'"
      [disabled]="leftDisabled()"
      (click)="onLeftArrowClick()"
      [class.invisible]="!canScroll() && !moreComing()"
      [class.pointer-events-none]="!canScroll() && !moreComing()"
      class="hidden md:flex absolute left-1 top-1/2 -translate-y-1/2 z-10 h-9 w-9 items-center justify-center rounded-full bg-white shadow-md border border-gray-100 text-gray-600 disabled:opacity-0 disabled:pointer-events-none cursor-pointer focus:outline-none transition-opacity"
    >
      <span class="material-symbols-sharp select-none text-[26px] leading-none">chevron_left</span>
    </button>
    }
  </div>
</div>
