<div class="w-full">
  <div
    #scrollContainer
    class="scrollbar-hide flex w-full overflow-x-auto px-1 py-2"
    style="overflow-anchor: none"
    (scroll)="onScroll()"
  >
    <ng-content />
  </div>

  <div dir="ltr" class="mt-1 flex w-full items-center justify-start gap-1 px-1">
    <button
      type="button"
      aria-label="Scroll left"
      [disabled]="leftDisabled()"
      (click)="scrollLeft()"
      class="flex h-8 w-8 items-center justify-center rounded-full border border-gray-100 bg-gray-50  text-primary shadow-sm transition-all duration-200 hover:border-primary/40 hover:bg-primary/5 active:scale-95 disabled:pointer-events-none disabled:opacity-30"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18L9 12L15 6" />
      </svg>
    </button>

    <button
      type="button"
      aria-label="Scroll right"
      [disabled]="rightDisabled()"
      (click)="scrollRight()"
      class="flex h-8 w-8 items-center justify-center rounded-full border border-gray-100 bg-gray-50  text-primary shadow-sm transition-all duration-200 hover:border-primary/40 hover:bg-primary/5 active:scale-95 disabled:pointer-events-none disabled:opacity-30"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18L15 12L9 6" />
      </svg>
    </button>
  </div>
</div>
