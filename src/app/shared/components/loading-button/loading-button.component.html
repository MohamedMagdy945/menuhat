<button
  [type]="type()"
  [disabled]="loading() || disabled()"
  (click)="onClick()"
  [class.w-full]="fullWidth()"
  class="submit-btn"
>
  @if (loading()) {
    <span class="btn-spinner"></span>
    <span>{{ loadingText() }}</span>
  } @else {
    <span>{{ text() }}</span>
    @if (showArrow()) {
      <span class="material-symbols-sharp btn-arrow select-none leading-none text-[20px]">
        arrow_back
      </span>
    }
  }
</button>
