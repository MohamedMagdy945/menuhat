<button [type]="type()" [disabled]="loading() || disabled()" (click)="onClick()" [class.w-full]="fullWidth()"
  class="group relative flex h-12 cursor-pointer items-center justify-center gap-2.5 overflow-hidden rounded-2xl border-none bg-primary px-6 text-[15px] font-bold text-white  transition-all duration-250 ease-out disabled:cursor-not-allowed disabled:bg-none disabled:bg-orange-300 disabled:from-orange-300 disabled:to-orange-300 disabled:opacity-75 disabled:shadow-none">
  @if (loading()) {
  <span class="h-4.5 w-4.5 shrink-0 animate-spin rounded-xl border-[2.5px] border-white/40 border-t-white"></span>
  <span>{{ loadingText() }}</span>
  } @else {
  <span>{{ text() }}</span>
  @if (showArrow()) {
  <span
    class="material-symbols-sharp select-none leading-none text-[20px] transition-transform duration-200">
    arrow_back
  </span>
  }
  }
</button>
