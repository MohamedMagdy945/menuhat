@for (_ of skeletons; track $index) {
  <div 
    class="w-48 shrink-0 md:w-52"
    [class.hidden]="$index === 2"
    [class.md:block]="$index === 2"
  >
    <div
      class="flex h-full w-full flex-col overflow-hidden rounded-2xl border border-gray-100 bg-white p-3 shadow-sm animate-pulse"
    >
      <!-- Image -->
      <div
        class="relative min-h-17 w-full flex-1 rounded-xl bg-gray-200"
      ></div>

      <!-- Content -->
      <div class="flex flex-1 flex-col justify-between pt-3">

        <!-- Title + Description -->
        <div class="space-y-2">
          <div class="h-4 w-3/4 rounded-md bg-gray-200"></div>

          <div class="h-3 w-1/2 rounded-md bg-gray-200"></div>
        </div>

        <!-- Price + Cart -->
        <div class="flex items-center justify-between pt-2">
          <div class="h-3.5 w-16 rounded-md bg-gray-200"></div>

          <div class="h-8 w-8 rounded-full bg-gray-200"></div>
        </div>

      </div>
    </div>
  </div>
}
