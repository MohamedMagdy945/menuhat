<div class="p-10">
    <swiper-container slides-per-view="1" space-between="0" loop="true" autoplay-delay="3000"
        autoplay-disable-on-interaction="false" pagination="true">

        <swiper-slide>
            <!-- Banner Container -->
            <section
                class="relative w-full h-[380px] overflow-hidden rounded-[32px] shadow-2xl bg-gradient-to-r from-[#3d2212]  to-[#9b6029]">

                <!-- Content Area -->
                <div class="relative z-10 h-full flex items-center justify-between px-6 md:px-12" dir="rtl">

                    <!-- Right Side: Text Wrapper -->
                    <div class="w-full md:w-[50%] text-right text-white flex flex-col items-start z-10">

                        <!-- Badge -->
                        <span
                            class="inline-block bg-[#ff5e00] text-white text-xs font-bold px-4 py-1 rounded-full mb-3 shadow-md">
                            عرض خاص
                        </span>

                        <!-- Main Title -->
                        <h1 class="text-4xl lg:text-5xl font-black leading-tight text-white tracking-wide">
                            الوجبات <span class="text-[#ff4d2e]">الأكثر طلباً</span>
                            <br>
                            في منطقتك
                        </h1>

                        <!-- Description -->
                        <p
                            class="text-sm lg:text-base font-normal mt-3 leading-relaxed text-gray-200 opacity-90 max-w-md">
                            اكتشف الأطباق التي يعشقها الجميع في منطقتك،
                            <br>
                            جودة استثنائية وتوصيل سريع لباب منزلك.
                        </p>

                        <!-- Button -->
                        <button
                            class="mt-5 bg-[#ff5e00] hover:bg-[#e05300] transition duration-300 text-white text-sm font-bold px-8 py-3 rounded-2xl shadow-lg hover:scale-105 active:scale-95 cursor-pointer">
                            اطلب الآن
                        </button>

                    </div>

                    <!-- Left Side: Circular Burger Frame (Dynamic Responsive) -->
                    <div class="w-full md:w-[50%] h-full flex items-center justify-center p-4">
                        <!-- Dynamic Responsive Circle -->
                        <div
                            class="h-[95%] max-h-[400px] aspect-square rounded-full bg-[#180f0a]/85 border border-white/10 shadow-2xl flex items-center justify-center overflow-hidden">
                            <img src="/images/banner-1.png" alt="Burger"
                                class="w-full h-full object-cover rounded-full scale-110">
                        </div>
                    </div>

                </div>
            </section>
        </swiper-slide>

    </swiper-container>
</div>
