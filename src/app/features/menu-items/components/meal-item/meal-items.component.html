<article class="overflow-hidden bg-white border border-slate-200 cursor-pointer rounded-2xl">
  <!-- الصورة والحالة -->
  <div class="relative h-30 w-full overflow-hidden bg-gray-100">
    <img
      [src]="menuItem().photoURL ? apiUrl + menuItem().photoURL : '/images/default-meal.png'"
      [alt]="menuItem().productName"
      class="h-full w-full object-contain"
    />
    <!-- زر المفضلة (أعلى اليسار) -->
    <button
      type="button"
      aria-label="Favorite"
      (click)="toggleFavorite()"
      class="absolute top-2.5 left-2.5 flex h-7 w-7 cursor-pointer items-center justify-center rounded-full bg-black/20 text-white backdrop-blur-sm transition hover:bg-black/40"
    >
      <svg
        lucideHeart
        class="h-4 w-4 transition-colors duration-200"
        [class.fill-red-500]="isFavorite()"
        [class.text-red-500]="isFavorite()"
      ></svg>
    </button>

    <!-- شارة الخصم (أعلى اليمين) -->
    @if (menuItem().oldPrice > menuItem().price) {
      <span
        class="absolute top-2.5 right-2.5 rounded-full bg-orange-500 px-3 py-1 text-xs font-bold text-white"
      >
        خصم
        {{
          menuItem().discountPercentage ||
            Math.round(((menuItem().oldPrice - menuItem().price) / menuItem().oldPrice) * 100)
        }}%
      </span>
    }
  </div>

  <!-- المحتوى -->
  <div class="px-3 py-2 text-right">
    <!-- اسم الوجبة -->
    <h3 class="truncate text-base font-bold text-gray-900">
      {{ menuItem().productName }}
    </h3>

    <!-- اسم المطعم -->
    <p class="mt-0.5 truncate text-sm text-gray-400">
      {{ menuItem().clientName }}
    </p>

    <!-- السعر والتقييم -->
    <div class="mt-1 flex items-center justify-between">
      <!-- التقييم (ثابت أو من الـ Model لو موجود) -->
      <div class="flex items-center gap-1 text-sm text-gray-400">
        <span class="font-bold text-gray-700">4.8</span>
        <span class="text-yellow-400">★</span>
        <span>(1.2k تقييم)</span>
      </div>
      <!-- السعر -->
      <div class="flex items-baseline gap-1 text-orange-500 font-extrabold text-base">
        <span>{{ menuItem().price }}</span>
        <span class="text-xs">ج.م</span>
      </div>
    </div>
  </div>
</article>
