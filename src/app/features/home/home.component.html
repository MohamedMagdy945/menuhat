<!-- Mobile Hero (First Section) -->
<app-home-mobile-first-section class="block md:hidden" />

<!-- Desktop Hero (First Section) -->
<app-home-desktop-first-section class="hidden md:block" />

<!-- product section -->
@if (menuItemService.items().length > 0) {
<div class="mt-2">
  <app-home-menu-items />
</div>
}

<!-- Trending Restaurants -->
@if (restaurantsService.trends().length > 0) {
<div class="mt-2">
  <app-home-restaurants title="رائج الآن"
    [restaurants]="restaurantsService.trends()" />
</div>
}

<!-- restaurants section -->
@if (restaurantsService.topVisits().length > 0) {
<div class="mt-2">
  <app-home-restaurants title="الأكثر زيارة"
    [restaurants]="restaurantsService.topVisits()" />
</div>
}

<!-- Nearest Restaurants -->
@if (restaurantsService.nearestRestaurants().length > 0) {
<div class="mt-2">
  <app-home-restaurants title="الأقرب إلى منطقتك"
    [restaurants]="restaurantsService.nearestRestaurants()" />
</div>
}

<!-- Top Rated Restaurants -->
@if (restaurantsService.topRates().length > 0) {
<div class="mt-2">
  <app-home-restaurants title="الأعلى تقييماً"
    [restaurants]="restaurantsService.topRates()" />
</div>
}
