<div class="py-4 px-8">
    <swiper-container slides-per-view="1" space-between="0" loop="true" autoplay-delay="3000"
        autoplay-disable-on-interaction="false" pagination="true">

        <!-- Banner 1 -->
        <swiper-slide>
            <section
                class="relative  overflow-hidden rounded-[24px] bg-gradient-to-r from-[#3d2212] to-[#9b6029] shadow-2xl md:h-[360px] md:rounded-[32px]">

                <div dir="rtl"
                    class="relative z-10 mx-auto flex h-full w-full max-w-screen-2xl items-center px-4 py-8 sm:px-8 md:px-12 lg:px-16">

                    <!-- Content -->
                    <div class="relative z-20 flex-1 text-right text-white">

                        <span
                            class="inline-flex items-center rounded-full bg-[#ff5e00] px-2 py-1.5 text-[11px] font-bold shadow-md sm:text-xs">
                            عرض خاص
                        </span>

                        <h1
                            class="mt-3 max-w-xl text-3xl font-black leading-[1.15] tracking-wide sm:text-4xl md:text-[42px] lg:text-5xl">
                            الوجبات
                            <span class="text-[#ff4d2e]">الأكثر طلباً</span>
                            <br class="hidden sm:block">
                            في منطقتك
                        </h1>

                        <p class="mt-3 max-w-lg text-xs leading-6 text-gray-200 opacity-90 sm:text-sm md:text-base">
                            اكتشف الأطباق التي يعشقها الجميع في منطقتك،
                            جودة استثنائية وتوصيل سريع لباب منزلك.
                        </p>

                        <button
                            class="mt-5 rounded-2xl bg-[#ff5e00] px-6 py-2.5 text-sm font-bold text-white shadow-lg transition duration-300 hover:bg-[#e05300] hover:scale-105 active:scale-95">
                            اطلب الآن
                        </button>

                    </div>

                    <!-- Visual -->
                    <div class="relative mr-4 flex shrink-0 items-center justify-center sm:mr-6 md:mr-10 ">
                        <div
                            class="flex  items-center justify-center overflow-hidden rounded-full bg-[#180f0a]/85 shadow-2xl ring-1 ring-white/10 sm:h-52 sm:w-52 md:h-64 md:w-64 lg:h-80 lg:w-80">

                            <img src="/images/banner-1.png" alt="Burger"
                                class="h-full w-full rounded-full object-cover scale-105">

                        </div>

                    </div>

                </div>
            </section>
        </swiper-slide>

        <!-- Banner 2 -->
        <swiper-slide>
            <section
                class="relative  w-full overflow-hidden rounded-[24px] shadow-2xl md:h-[360px] md:rounded-[32px]">

                <!-- Background Gradient -->
                <div class="absolute inset-0 bg-gradient-to-r from-[#FFCB55] via-[#FFA52F] to-[#F47716]"></div>

                <!-- Optional soft glow -->
                <div
                    class="absolute inset-0 bg-[radial-gradient(circle_at_35%_45%,rgba(255,220,110,0.45),transparent_45%)]">
                </div>

                <!-- Right Image -->
                <div class="absolute inset-y-0 right-30 flex items-center justify-end sm:w-[30%] md:w-[38%]">
                    <img src="/images/banner-3.png" alt="" class="h-full w-full cover" />
                </div>

                <!-- Content -->
                <div class="relative z-10 flex h-full items-center px-5 py-8 sm:px-8 md:px-12 lg:px-16">
                    <div class="w-full text-center text-white sm:w-[65%] md:w-[55%] lg:w-[50%]">

                        <!-- Title -->
                        <h1 class="mb-3 text-3xl font-bold leading-tight sm:text-4xl md:mb-4 md:text-5xl lg:text-6xl">
                            خصم إضافي
                        </h1>

                        <!-- Description -->
                        <p
                            class="mx-auto mb-5 max-w-lg text-sm leading-7 sm:text-base sm:leading-8 md:mb-7 md:text-xl lg:text-2xl">
                            استمتع بطلبك الأول مع خصم
                            <br class="hidden sm:block">
                            خاص جدًا ومميز. لا تفوت الفرصة!
                        </p>

                        <!-- Button -->
                        <button
                            class="rounded-full bg-white px-7 py-2.5 text-base font-bold text-orange-600 shadow-lg transition duration-300 hover:scale-105 sm:px-9 sm:py-3 sm:text-lg md:px-12 md:text-xl">
                            اطلب الآن
                        </button>

                    </div>
                </div>

            </section>
        </swiper-slide>
    </swiper-container>

</div>
