<article dir="rtl" class="overflow-hidden rounded-2xl border border-slate-200 bg-white">
  <!-- الصورة والحالة -->
  <div class="relative h-27 w-full overflow-hidden">
    <!-- رابط تفاصيل الوجبة -->
    <a
      [routerLink]="['/menu-items', menuItem().menuId]"
      class="block h-full w-full"
      [attr.aria-label]="'عرض تفاصيل ' + menuItem().productName"
    >
      <img
        [src]="menuItem().photoURL ? apiUrl + menuItem().photoURL : '/images/default-meal.png'"
        [alt]="menuItem().productName"
        class="h-full w-full object-contain"
      />
    </a>

    <!-- زر المفضلة -->
    <button
      type="button"
      aria-label="Favorite"
      (click)="toggleFavorite()"
      class="absolute top-2.5 left-2.5 z-10 flex h-6 w-6 shadow-sm text-lg cursor-pointer items-center justify-center rounded-full text-white transition bg-black/20"
    >
      <span
        class="material-symbols-sharp transition-colors duration-200"
        [class.text-red-500]="isFavorite()"
        [class.icon-fill]="isFavorite()"
      >
        {{ isFavorite() ? 'favorite' : 'favorite_border' }}
      </span>
    </button>

    <!-- شارة الخصم -->
    @if (menuItem().oldPrice > menuItem().price) {
      <span
        class="absolute top-2.5 right-2.5 z-10 rounded-full bg-orange-500 px-3 py-1 text-xs font-bold text-white"
      >
        خصم
        {{
          menuItem().discountPercentage ||
            Math.round(((menuItem().oldPrice - menuItem().price) / menuItem().oldPrice) * 100)
        }}%
      </span>
    }
  </div>

  <!-- المحتوى -->
  <div class="px-3 py-2 text-right">
    <!-- اسم الوجبة -->
    <h3 class="truncate text-base font-semibold text-gray-900">
      {{ menuItem().productName }}
    </h3>

    <!-- اسم المطعم -->
    <p class="mt-0.5 truncate text-sm font-semibold text-gray-400">
      {{ menuItem().clientName }}
    </p>

    <!-- السعر والتقييم -->
    <div class="mt-1 flex items-center justify-between">
      <!-- التقييم -->
      <div class="flex items-center gap-1 text-sm text-gray-400">
        <span class="font-bold text-gray-700">4.8</span>
        <span
          class="material-symbols-sharp icon-fill select-none text-[15px] leading-none text-amber-400"
        >
          star
        </span>
        <span>(1.2k تقييم)</span>
      </div>

      <!-- السعر -->
      <div class="flex items-baseline gap-1 text-base font-extrabold text-orange-500">
        <span>{{ menuItem().price }}</span>
        <span class="text-xs">ج.م</span>
      </div>
    </div>
  </div>
</article>
