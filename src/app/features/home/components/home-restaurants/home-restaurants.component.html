@if (restaurants() && restaurants().length > 0) {
<section class="relative w-full">
  <!-- Section Header -->
  <div class="flex items-center justify-between px-1">
    <!-- Title -->
    <h2 class="text-xl font-bold tracking-tight text-gray-900">
      {{ title() }}
    </h2>

    <!-- View All -->
    <button
      type="button"
      class="text-sm font-semibold text-orange-500 cursor-pointer"
    >
      عرض الكل
    </button>
  </div>

  <!-- Free Horizontal Scroll with Tailwind Widths (w-64 on mobile, w-72 on sm, w-80 on md) -->
  <app-carousel class="mt-1 block w-full" gap="16">
    @for (restaurant of restaurants(); track restaurant.id) {
      <app-home-restaurant-card
        [restaurant]="restaurant"
        class="w-58 md:w-60"
      />
    }
  </app-carousel>
</section>
}
