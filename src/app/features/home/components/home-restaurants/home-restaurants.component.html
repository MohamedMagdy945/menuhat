<section class="relative w-full">
  <!-- Section Header -->
  <div class="flex items-center justify-between px-1">
    <!-- Title -->
    <h2 class="text-xl font-bold tracking-tight text-gray-900">
      {{ title() }}
    </h2>

    <!-- View All -->
    <button type="button"
      class="text-sm font-semibold text-orange-500 transition-colors duration-200 hover:text-orange-600">
      عرض الكل
    </button>
  </div>

  <!-- Horizontal Scroll (Configured internally for optimal restaurant card sizes) -->
  <app-carousel class="mt-3 block w-full" items="2 sm:3 md:4 lg:5 xl:7" [hasMore]="hasMoreData()"
    [isLoading]="isLoadingMore()" (loadMore)="onLoadMore()">
    @for (restaurant of restaurants(); track restaurant.id) {
    <app-home-restaurant-card [restaurant]="restaurant" class="w-full" />
    }
  </app-carousel>
</section>
