<div class="relative">
  <!-- Trigger Button -->
  <button
    (click)="toggleDropdown($event)"
    class="flex items-center  bg-white gap-2 pl-4 pr-1.5 py-1.5 rounded-full shadow-sm cursor-pointer select-none transition-all duration-200 hover:shadow-md"
  >
    <!-- Avatar Icon -->
    <div
      class="w-7 h-7 rounded-full  border border-gray-100 bg-orange-500 text-white flex items-center justify-center shrink-0 shadow-sm"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
    </div>

    <!-- Label: name if logged in, else حسابي -->
    @if (isAuthenticated()) {
      <span class="text-sm font-semibold text-slate-700 max-w-30 truncate">{{ userName }}</span>
    } @else {
      <span class="text-sm font-semibold text-slate-700">حسابي</span>
    }

    <!-- Chevron -->
    <svg
      class="w-3 h-3 text-slate-400 transition-transform duration-200 mr-0.5"
      [class.rotate-180]="isOpen()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Panel -->
  @if (isOpen()) {
    <!-- Triangle pointer -->
    <div class="dropdown-arrow"></div>

    <div
      class="dropdown-panel absolute left-0 mt-2 w-52 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden z-50 animate-dropdown"
    >

      <!-- Header (shown when logged in) -->
      @if (isAuthenticated()) {
        <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-100 bg-gray-50">
          <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center shrink-0 shadow-sm text-sm font-bold">
            {{ userName.charAt(0) }}
          </div>
          <div class="flex flex-col min-w-0">
            <span class="text-sm font-bold text-slate-800 truncate">{{ userName }}</span>
            <span class="text-xs text-slate-400">مرحباً بك 👋</span>
          </div>
        </div>
      }

      <!-- Menu Items -->
      <ul class="py-1">

        @if (isAuthenticated()) {
          <!-- My Profile -->
          <li>
            <button
              (click)="navigateToProfile($event)"
              class="dropdown-item w-full flex items-center gap-2 px-4 py-1 text-sm text-slate-700 hover:bg-orange-50  transition-colors duration-150 text-right"
            >
              <span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </span>
              <span class="font-medium">ملفي الشخصي</span>
            </button>
          </li>

          <!-- Divider -->
          <li class="mx-3  border-t border-gray-100"></li>

          <!-- Logout -->
          <li>
            <button
              (click)="logout($event)"
              class="dropdown-item w-full flex items-center gap-3 px-4 py-1 text-sm text-red-500 hover:bg-red-50 transition-colors duration-150 text-right"
            >
              <span class="w-7 h-7 rounded-full bg-red-50 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
              </span>
              <span class="font-semibold">تسجيل الخروج</span>
            </button>
          </li>

        } @else {
          <!-- Login -->
          <li>
            <button
              (click)="navigateToLogin($event)"
              class="dropdown-item w-full flex items-center gap-3 px-3 py-1.5 text-sm text-orange-600 hover:bg-orange-50 transition-colors duration-150 text-right"
            >
              <span class="w-7 h-7 rounded-full bg-orange-50 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
              </span>
              <span class="font-semibold">تسجيل الدخول</span>
            </button>
          </li>
        }

      </ul>
    </div>
  }
</div>
