<section class="relative w-full">
  <!-- Section Header -->
  <div class="flex items-center justify-between pb-1">
    <!-- Title -->
    <h2 class="text-xl font-bold tracking-tight text-gray-900">
      {{ title() }}
    </h2>

    <!-- View All Button -->
    <button type="button" class="font-semibold text-orange-500 transition-colors duration-200 hover:text-orange-600">
      عرض الكل
    </button>
  </div>

  <!-- Shared Horizontal Scroll -->
  <app-horizontal-scroll>
    <div class="flex w-max items-stretch gap-2.5 md:gap-4 py-1">
      <!-- Menu Items -->
      @for (item of items(); track item.mostrequestesId) {
      <div class="w-46 shrink-0 md:w-50">
        <app-home-menu-item-card class="block w-full" [menuItem]="item" />
      </div>
      }
    </div>
  </app-horizontal-scroll>
</section>
