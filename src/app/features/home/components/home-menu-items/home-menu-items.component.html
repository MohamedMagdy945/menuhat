@if (items().length > 0) {
<section class="relative w-full">
  <!-- Section Header -->
  <div class="flex items-center justify-between">
    <!-- Title -->
    <h2 class="text-xl font-bold tracking-tight text-gray-900">
      {{ title() }}
    </h2>

    <!-- View All Link -->
    <a
      routerLink="/most-ordered"
      class="cursor-pointer font-semibold text-orange-500 transition-colors duration-200"
    >
      عرض الكل
    </a>
  </div>

  <!-- Free Horizontal Scroll with Tailwind Widths (w-52 on mobile, w-56 on sm, w-60 on md) -->
  <app-carousel class="mt-2 block w-full" gap="14">
    @for (item of items(); track item.mostrequestesId) {
      <app-home-menu-item-card
        [menuItem]="item"
        class="w-49 md:w-50 shrink-0"
      />
    }
  </app-carousel>
</section>
}
