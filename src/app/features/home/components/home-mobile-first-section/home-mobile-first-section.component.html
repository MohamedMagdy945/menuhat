<!-- Mobile Hero (First Section) -->
<section class="w-full block md:hidden select-none">
  <!-- Top Orange Gradient Card -->
  <div
    class="relative w-full bg-linear-to-b from-[#FFA73A] to-[#F88220] rounded-b-[38px] shadow-md px-2 pt-2 text-white"
  >
    <!-- Top Bar: Greeting & Actions -->
    <header class="flex items-center justify-between pb-1">
      <!-- Right: User Avatar & Greeting -->
      <a routerLink="/profile" class="flex items-center gap-2.5 cursor-pointer select-none">
        <div
          class="w-10 h-10 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-white shrink-0 shadow-sm"
        >
          <span
            class="material-symbols-sharp text-2xl text-white leading-none select-none"
            aria-hidden="true"
            >person</span
          >
        </div>

        <div class="flex flex-col text-right leading-tight">
          <span class="text-[11px] text-white/80 font-normal">مرحبا</span>
          <span class="text-sm font-bold text-white tracking-wide">
            {{ userName() }}
          </span>
        </div>
      </a>

      <!-- Left: Action Dropdowns (Cart, Favorites, Notifications) -->
      <div class="flex items-center gap-2">
        <!-- Cart Dropdown -->
        <app-cart-dropdown variant="mobile-header"></app-cart-dropdown>

        <!-- Favorites Dropdown -->
        <app-favorite-dropdown variant="mobile-header"></app-favorite-dropdown>

        <!-- Notifications Dropdown -->
        <app-notification-dropdown variant="mobile-header"></app-notification-dropdown>
      </div>
    </header>

    <!-- Banner Content: 3D Shopping Cart & Menuhat Logo -->
    <div class="relative flex items-center justify-between h-55">
      <!-- Right (in RTL): Menuhat Logo (Smaller Column: ~35% - 40%) -->
      <div class="w-[45%] flex flex-col items-center justify-center text-center">
        <img
          src="/icons/menuhat-logo.svg"
          alt="Menuhat"
          class="w-full max-w-32 h-70 object-contain drop-shadow-sm select-none"
        />
      </div>

      <!-- Left (in RTL): 3D Cart with Food & Menus (Bigger Hero Column: ~60% - 65%) -->
      <div class="w-[55%] flex items-center py-2">
        <img
          src="/images/banner-3.png"
          alt="Shopping Cart"
          class="w-75 h-70 object-contain drop-shadow-lg select-none pointer-events-none"
        />
      </div>
    </div>
  </div>

  <!-- Search & Filter Bar (Overlapping bottom curve) -->
  <div class="relative -mt-4 z-20 px-4 mb-4">
    <app-search-bar variant="mobile" />
  </div>
</section>
