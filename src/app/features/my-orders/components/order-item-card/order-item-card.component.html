<article class="bg-white rounded-2xl shadow-sm px-4 sm:px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

  <!-- Right Part: Image + Info -->
  <div class="flex items-center gap-3.5 sm:gap-4 min-w-0">
    <!-- Restaurant Image / Logo -->
    <img
      [src]="logoUrl()"
      (error)="$any($event.target).src = '/images/default.png'"
      [alt]="order().clientName ?? 'مطعم'"
      class="w-14 h-14 sm:w-19 sm:h-19 rounded-lg object-cover bg-neutral-900 border border-gray-100 shrink-0"
    />

    <!-- Text Info -->
    <div class="min-w-0 text-right space-y-2">
      <!-- Top Line: Order Number & Status Badge -->
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-400 font-medium">طلب #{{ order().serialOrder || order().menuOrdersId }}</span>
        <span
          class="text-[11px] px-2 py-1 rounded-md font-bold"
          [ngClass]="statusConfig().classes"
        >
          {{ statusLabel() }}
        </span>
      </div>

      <!-- Restaurant Name -->
      <h3 class="text-base sm:text-base font-semibold text-gray-900 truncate">
        {{ order().clientName?.trim() || 'اسم المطعم' }}
      </h3>

      <!-- Date & Time with Calendar Icon -->
      <div class="flex items-center gap-1.5 text-xs text-gray-400">
        <svg
          class="w-3.5 h-3.5 text-gray-400 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
          <line x1="16" x2="16" y1="2" y2="6" />
          <line x1="8" x2="8" y1="2" y2="6" />
          <line x1="3" x2="21" y1="10" y2="10" />
        </svg>
        <span>{{ formattedDate() }}</span>
      </div>
    </div>
  </div>

  <!-- Left Part: Action Buttons (No hover, smaller refined scale) -->
  <div class="flex items-center gap-2.5 sm:gap-3 shrink-0 self-stretch sm:self-center justify-end">
    <button
      type="button"
      (click)="onCancel()"
      [disabled]="!canCancel()"
      class="rounded-xl border border-gray-400 bg-white px-4 sm:px-5 py-2 text-xs sm:text-sm text-gray-500 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
    >
      إلغاء الطلب
    </button>

    <button
      type="button"
      (click)="onView()"
      class="rounded-xl border-1 border-orange-500 bg-white px-4 sm:px-5 py-2 text-xs sm:text-sm font-semibold text-orange-500 cursor-pointer active:scale-95"
    >
      عرض التفاصيل
    </button>
  </div>

</article>
