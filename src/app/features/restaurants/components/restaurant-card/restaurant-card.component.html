<article
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  tabindex="0"
  dir="rtl"
  class="flex h-full w-full flex-col cursor-pointer overflow-hidden rounded-xl border border-gray-200 bg-white"
>
  <!-- Image -->
  <div class="relative h-36 overflow-hidden bg-gray-100">
    <img
      [src]="restaurant().logoURL ? apiUrl + restaurant().logoURL : defaultImage"
      [alt]="restaurant().clientName"
      class="h-full w-full object-cover"
    />

    <!-- Rating -->
    @if (restaurant().rate !== null) {
      <div
        class="absolute bottom-2 left-2 flex items-center gap-1 rounded-lg bg-white px-2 py-1 text-xs font-bold text-gray-700 shadow-sm"
      >
        <span>{{ restaurant().rate }}</span>
        <span class="text-yellow-400">★</span>
      </div>
    }
  </div>

  <!-- Content -->
  <div class="px-2 py-2">
    <!-- Restaurant Name -->
    <div class="flex items-center">
      <h3
        class="min-w-0 truncate text-base font-bold leading-6 text-gray-600"
        [title]="restaurant().clientName"
      >
        {{ restaurant().clientName }}
      </h3>
    </div>

    <!-- Info -->
    <div class="mt-1.5 space-y-1 text-sm text-gray-700">
      <!-- Restaurant Field -->
      <div class="flex min-w-0 items-center gap-1">
        <div class="rounded-lg text-gray-400">
          <svg
            class="h-4 w-4 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 13.5 13.5 20a2 2 0 0 1-2.83 0L4 13.33V4h9.33L20 10.67a2 2 0 0 1 0 2.83Z" />
            <circle cx="8.5" cy="8.5" r="1.25" />
          </svg>
        </div>

        <span class="truncate">
          {{ restaurant().field_Ar }}
        </span>
      </div>

      <!-- Address -->
      @if (restaurant().address) {
        <div class="flex min-w-0 items-center gap-1">
          <div class="text-gray-400">
            <svg
              class="h-4 w-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M12 21s7-5.75 7-11a7 7 0 1 0-14 0c0 5.25 7 11 7 11Z"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="10" r="2.75" />
            </svg>
          </div>

          <span class="truncate">
            {{ restaurant().address }}
          </span>
        </div>
      }

      <!-- Working Hours + Status -->
      <div class="flex items-center justify-between gap-4">
        <div class="flex min-w-0 items-center gap-1">
          <!-- Clock -->
          <div class="text-gray-400">
            <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2.75a9.25 9.25 0 1 0 9.25 9.25A9.26 9.26 0 0 0 12 2.75Zm0 16.5a7.25 7.25 0 1 1 7.25-7.25A7.26 7.26 0 0 1 12 19.25Zm1-11.25h-2v5.25l4 2.5 1-1.65-3-1.85V8.25Z"
              />
            </svg>
          </div>

          <span class="truncate">10:00 ص - 02:00 ص</span>
        </div>

        <span
          class="shrink-0 rounded-full px-1.5 py-1 text-[11px] font-bold"
          [class.bg-emerald-50]="restaurant().isOpen"
          [class.text-emerald-500]="restaurant().isOpen"
          [class.bg-red-50]="!restaurant().isOpen"
          [class.text-red-400]="!restaurant().isOpen"
        >
          {{ restaurant().isOpen ? 'مفتوح الآن' : 'مغلق الآن' }}
        </span>
      </div>
    </div>
  </div>
</article>
