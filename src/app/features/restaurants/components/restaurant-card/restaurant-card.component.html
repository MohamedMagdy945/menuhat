<article class="relative flex flex-col h-full w-full overflow-hidden rounded-2xl border border-slate-200  shadow-xs bg-white">
  <!-- ONE LINK -->
  <a [routerLink]="['/restaurants', restaurant().serial]" class="flex flex-col flex-1 h-full">
    <!-- ================= IMAGE ================= -->
    <div class="relative w-full overflow-hidden bg-slate-50">
      <div class="h-32">
        <div class="h-32 w-full overflow-hidden rounded-md">
          <img [src]="
            restaurant().logoURL ? apiUrl + restaurant().logoURL : defaultImage
          " [alt]="restaurant().clientName" class="h-full w-full object-contain" />
        </div>
      </div>

      @if (restaurant().isSponser) {
      <span
        class="absolute top-2.5 right-2.5 z-10 inline-flex items-center gap-1 rounded-full bg-primary px-2 py-2 text-[11px] font-semibold leading-none text-white shadow-xs">
        <span class="material-symbols-sharp select-none text-[16px] leading-none text-white">verified</span>
        مميز
      </span>
      }
    </div>

    <!-- ================= CONTENT ================= -->
    <div class="flex flex-col flex-1 justify-between mx-3 py-1">
      <!-- Top info (Name + Field + Address) -->
      <div>
        <!-- Restaurant Name -->
        <div class="flex items-center">
          <h3
            class="min-w-0 truncate text-base font-semibold leading-6 text-gray-900"
            [title]="restaurant().clientName"
          >
            {{ restaurant().clientName }}
          </h3>
        </div>

        <!-- Info -->
        <div class="mt-1 space-y-1 text-sm">
          <!-- Restaurant Field -->
          <div class="flex min-w-0 items-center gap-1 text-gray-600">
            <span class="material-symbols-sharp select-none leading-none  text-[16px]">
              bookmarks
            </span>
            <span class="min-w-0 truncate text-sm font-semibold leading-5">
              {{ restaurant().field_Ar }}
            </span>
          </div>

          <!-- Address (Always reserves row space) -->
          <div class="flex min-w-0 items-center gap-1 text-gray-600">
            <span class="material-symbols-sharp shrink-0 leading-none text-[16px] text-gray-600">
              location_on
            </span>

            @if (restaurant().address) {
              <span class="min-w-0 truncate text-sm font-semibold leading-5">
                {{ restaurant().address }}
              </span>
            } @else {
              <span class="min-w-0 truncate text-sm font-medium leading-5 text-gray-400">
                غير محدد
              </span>
            }
          </div>
        </div>
      </div>

      <!-- Working Hours + Status (Anchored at bottom) -->
      <div class="flex items-center justify-between gap-4 pt-1">
        <div class="flex min-w-0 items-center gap-1 text-sm text-gray-600 font-medium">
          <!-- Clock -->
          <span class="material-symbols-sharp select-none text-[16px] leading-none text-gray-600">
            schedule
          </span>

          <span class="truncate">10:00 ص - 02:00 ص</span>
        </div>

        <span
          class="shrink-0 rounded-full px-2 py-1 text-[11px] font-bold"
          [class.bg-emerald-50]="restaurant().isOpen"
          [class.text-emerald-500]="restaurant().isOpen"
          [class.bg-red-50]="!restaurant().isOpen"
          [class.text-red-400]="!restaurant().isOpen"
        >
          {{ restaurant().isOpen ? 'مفتوح الآن' : 'مغلق الآن' }}
        </span>
      </div>
    </div>
  </a>

  <!-- Favorite - OUTSIDE LINK -->
  <button type="button" aria-label="Favorite" (click)="toggleFavorite()"
    class="absolute top-2.5 left-2.5 z-10 flex h-7 w-7 cursor-pointer items-center justify-center rounded-full bg-black/20 text-xl text-white shadow-sm transition">
    <span class="material-symbols-sharp transition-colors duration-200" [class.text-red-500]="isFavorite()"
      [class.icon-fill]="isFavorite()">
      {{ isFavorite() ? 'favorite' : 'favorite_border' }}
    </span>
  </button>
</article>
