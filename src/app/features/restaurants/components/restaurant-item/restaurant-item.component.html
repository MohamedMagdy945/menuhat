<article
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  tabindex="0"
  dir="rtl"
  class="cursor-pointer overflow-hidden rounded-xl border border-gray-200 bg-white"
>
  <!-- Image -->
  <div class="relative h-36 overflow-hidden bg-gray-100">
    <img
      [src]="restaurant().logoURL"
      [alt]="restaurant().clientName"
      class="h-full w-full object-cover"
    />
  </div>

  <!-- Content -->
  <div class="px-3 py-2">

    <!-- Name + Rating -->
    <div class="flex items-center justify-between gap-3">

      <!-- Restaurant Name -->
      <h3
        class="min-w-0 truncate text-base font-bold text-gray-900"
        [title]="restaurant().clientName"
      >
        {{ restaurant().clientName }}
      </h3>

      <!-- Rating -->
      @if (restaurant().rate !== null) {
        <div class="flex shrink-0 items-center gap-1 text-sm font-semibold">
          <span class="text-gray-900">
            {{ restaurant().rate }}
          </span>

          <span class="text-yellow-400">
            ★
          </span>
        </div>
      }

    </div>

    <!-- Info -->
    <div class="mt-3 space-y-2.5 text-sm text-gray-500">

  <!-- Working Hours + Status -->
  <div class="flex items-center justify-between gap-4">

    <div class="flex min-w-0 items-center gap-2">

      <!-- Clock -->
      <svg
        class="h-[17px] w-[17px] shrink-0 text-gray-400"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path
          d="M12 2.75a9.25 9.25 0 1 0 9.25 9.25A9.26 9.26 0 0 0 12 2.75Zm0 16.5a7.25 7.25 0 1 1 7.25-7.25A7.26 7.26 0 0 1 12 19.25Z"
        />

        <path
          d="M12 6.5a1 1 0 0 0-1 1v4.91a1 1 0 0 0 .45.83l3.25 2.17a1 1 0 1 0 1.1-1.66L13 11.87V7.5a1 1 0 0 0-1-1Z"
        />
      </svg>

      <span class="truncate">
        10:00 ص - 02:00 ص
      </span>

    </div>

    <span
      class="shrink-0 text-xs font-semibold"
      [class.text-emerald-600]="restaurant().isOpen"
      [class.text-red-400]="!restaurant().isOpen"
    >
      {{ restaurant().isOpen ? 'مفتوح' : 'مغلق' }}
    </span>

  </div>


  <!-- Restaurant Field -->
  <div class="flex min-w-0 items-center gap-2">

    <!-- Store -->
    <svg
      class="h-[17px] w-[17px] shrink-0 text-gray-400"
      viewBox="0 0 24 24"
      fill="currentColor"
    >
      <path
        d="M4 9.5h16l-1.5-5h-13L4 9.5Z"
      />

      <path
        d="M5 10.5h14v8.75A1.75 1.75 0 0 1 17.25 21H6.75A1.75 1.75 0 0 1 5 19.25v-8.75Z"
      />

      <path
        d="M8.5 13h2v3.5h-2zM13.5 13h2v3.5h-2z"
        fill="#fff"
      />

      <path
        d="M4 9.5h16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      />
    </svg>

    <span class="truncate">
      {{ restaurant().field_Ar }}
    </span>

  </div>


  <!-- Address -->
  @if (restaurant().address) {

    <div class="flex min-w-0 items-center gap-2">

      <!-- Location -->
      <svg
        class="h-[17px] w-[17px] shrink-0 text-gray-400"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path
          d="M12 2.75a7.25 7.25 0 0 0-7.25 7.25c0 5.25 6.25 10.35 6.52 10.57a1.15 1.15 0 0 0 1.46 0c.27-.22 6.52-5.32 6.52-10.57A7.25 7.25 0 0 0 12 2.75Zm0 15.55c-1.75-1.6-5.25-5.4-5.25-8.3a5.25 5.25 0 1 1 10.5 0c0 2.9-3.5 6.7-5.25 8.3Z"
        />

        <circle
          cx="12"
          cy="10"
          r="2.25"
          fill="currentColor"
        />
      </svg>

      <span class="truncate">
        {{ restaurant().address }}
      </span>

    </div>

  }

</div>
  </div>
</article>
