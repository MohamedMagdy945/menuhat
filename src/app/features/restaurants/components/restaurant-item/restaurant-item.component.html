<article (click)="onCardClick()" (keydown.enter)="onCardClick()" tabindex="0" dir="rtl"
  class="cursor-pointer overflow-hidden rounded-xl bg-white border border-gray-200">
  <!-- Image -->
  <div class="relative h-36 overflow-hidden bg-gray-100">
    <img [src]="restaurant().logoURL" [alt]="restaurant().clientName" class="h-full w-full object-cover" />

    <!-- Status -->
    <div class="absolute left-2 top-2 rounded-md px-2 py-1 text-xs font-semibold bg-white "
      [class]="restaurant().isOpen ? ' text-emerald-600'  : ' text-red-400'">
      {{ restaurant().isOpen ? 'مفتوح الآن' : 'مغلق' }}
    </div>

    <!-- Favorite -->
    <button type="button"
      class="absolute right-2.5 top-2.5 flex h-6 w-6 items-center justify-center rounded-full bg-white shadow-sm"
      (click)="$event.stopPropagation()">
      <svg class="h-4 w-4 fill-red-500 text-red-500" viewBox="0 0 24 24">
        <path
          d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z" />
      </svg>
    </button>

    <!-- Rating -->
    @if (restaurant().rate !== null) {
    <div
      class="absolute bottom-2 left-2 flex items-center gap-1 rounded-md bg-white px-2 py-1 text-xs font-bold text-yellow-500 shadow-sm">
      <span class="text-sm text-yellow-400">★</span>
      <span>{{ restaurant().rate }}</span>
    </div>
    }
  </div>

  <!-- Content -->
  <div class="px-3 py-2.5">

    <!-- Name -->
    <h3 class="truncate text-base font-bold text-gray-900" [title]="restaurant().clientName">
      {{ restaurant().clientName }}
    </h3>

    <!-- Info -->
    <div class="mt-2 space-y-1.5 text-sm text-gray-400">

      <!-- Working Hours -->
      <div class="flex items-center gap-1.5">
        <svg class="h-4 w-4 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>

        <span>10:00 ص - 02:00 ص</span>
      </div>

      <!-- Field -->
      <div class="flex items-center gap-1.5">
        <svg class="h-4 w-4 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>

        <span class="truncate">
          {{ restaurant().field_Ar }}
        </span>
      </div>

      <!-- Address -->
      @if (restaurant().address) {
      <div class="flex items-center gap-1.5">
        <svg class="h-4 w-4 shrink-0 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M5 6v14h14V6" />
          <path d="M8 6V4h8v2" />
          <path d="M9 10v6" />
          <path d="M15 10v6" />
        </svg>

        <span class="truncate">
          {{ restaurant().address }}
        </span>
      </div>
      }
    </div>
  </div>
</article>
