<div class="my-6 flex items-center gap-1 overflow-x-auto pb-2 text-xs font-medium">
  <!-- All -->
  <button type="button" (click)="onSelectCategory(null)"
    class="whitespace-nowrap rounded-xl border px-4 py-2 transition"
    [class.border-orange-500]="selectedCategory === null" [class.bg-orange-500]="selectedCategory === null"
    [class.font-bold]="selectedCategory === null" [class.text-white]="selectedCategory === null"
    [class.border-gray-200]="selectedCategory !== null" [class.bg-white]="selectedCategory !== null"
    [class.text-gray-600]="selectedCategory !== null">
    الكل
  </button>

  <!-- Categories -->
  @for (category of categories; track category.id) {
  <button type="button" (click)="onSelectCategory(category.id)"
    class="whitespace-nowrap rounded-xl border px-4 py-2 transition"
    [class.border-orange-500]="selectedCategory === category.id"
    [class.bg-orange-500]="selectedCategory === category.id"
    [class.font-bold]="selectedCategory === category.id" [class.text-white]="selectedCategory === category.id"
    [class.border-gray-200]="selectedCategory !== category.id"
    [class.bg-white]="selectedCategory !== category.id"
    [class.text-gray-600]="selectedCategory !== category.id">
    {{ category.name }}
  </button>
  }
</div>
