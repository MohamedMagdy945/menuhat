<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" id="modalOverlay">
  <div class="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl" dir="rtl">
    <!-- Close Button -->
    <button class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 text-2xl" id="closeBtn" aria-label="إغلاق" (click)="closeModal()">&times;</button>

    <!-- Header -->
    <div class="mb-4">
      <h2 class="text-xl md:text-2xl font-bold text-gray-800">
        إضافة تقييم جديد لـ {{ restaurantName() }} <span class="inline-block w-2 h-2 rounded-full bg-orange-500 ml-1"></span>
      </h2>
      <p class="text-sm text-gray-500 mt-1">شاركنا رأيك في تجربتك لمساعدتنا على التطور</p>
    </div>

    <div class="my-4 h-px bg-gray-200"></div>

    <!-- Rating Section -->
    <div class="flex flex-col items-center gap-2 mb-6">
      <h3 class="text-lg font-semibold text-gray-700">تقييمك العام للطلب</h3>
      
      <div class="flex items-center gap-2" id="starsContainer" dir="rtl">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <span 
            class="cursor-pointer text-4xl transition-colors duration-200" 
            [class.text-yellow-400]="star <= rating()"
            [class.text-gray-200]="star > rating()"
            (click)="setRating(star)"
          >&#9733;</span>
        }
      </div>

      <div class="mt-2 rounded-full bg-orange-100 px-3 py-1 text-sm font-bold text-orange-600" id="ratingBadge">
        {{ getRatingLabel() }}
      </div>
    </div>

    <!-- Review Textarea Section -->
    <div class="mb-6">
      <div class="mb-2 flex items-center justify-between">
        <label for="reviewText" class="font-semibold text-gray-700">تفاصيل المراجعة</label>
        <span class="text-xs text-gray-400" id="charCounter">{{ comment().length }} / {{ maxCharacters() }} حرف</span>
      </div>
      <textarea 
        id="reviewText" 
        class="w-full rounded-lg border border-gray-300 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-1 focus:ring-orange-500 min-h-30 resize-y" 
        [maxLength]="maxCharacters()" 
        placeholder="اكتب تجربتك بالتفصيل هنا... ما الذي أعجبك؟ وما الذي يمكننا تحسينه؟"
        (input)="onCommentChange($event)"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
      <button class="w-full sm:w-auto px-6 py-2.5 rounded-lg font-bold bg-orange-500 text-white hover:bg-orange-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="submitBtn" (click)="submit()" [disabled]="!comment().trim()">نشر التقييم</button>
      <button class="w-full sm:w-auto px-6 py-2.5 rounded-lg font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors" id="cancelBtn" (click)="closeModal()">إلغاء</button>
    </div>
  </div>
</div>
