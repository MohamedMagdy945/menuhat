<section dir="rtl" class="mx-auto px-8 pt-4 ">

    <!-- Header -->

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-gray-900">
            {{ title() }}
        </h1>

        <p class="mt-1 text-sm text-gray-500">
            اكتشف المطاعم المتاحة
        </p>

    </div>


    <!-- Restaurants Grid -->

    <div class="grid grid-cols-2 gap-x-3 gap-y-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7">
        @for (restaurant of restaurants(); track restaurant.id) {
            <app-restaurant-card [restaurant]="restaurant" />
        }
    </div>

    @if (restaurants().length === 0 && isLoading()) {
        <p class="py-12 text-center text-sm text-gray-500">جاري تحميل المطاعم...</p>
    } @else if (restaurants().length === 0) {
        <p class="py-12 text-center text-sm text-gray-500">لا توجد مطاعم متاحة حاليًا</p>
    }

    @if (restaurants().length > 0 && hasMore()) {
        <div class="my-10 flex items-center justify-center">
            <button
                type="button"
                class="group inline-flex items-center gap-2 rounded-full border border-gray-300 bg-white px-8 py-2.5 text-sm font-bold text-gray-800 shadow-xs hover:border-orange-500 hover:bg-orange-50/40 hover:text-orange-600 hover:shadow-sm active:scale-95 transition-all duration-200 disabled:pointer-events-none disabled:opacity-50 cursor-pointer"
                [disabled]="isLoading()"
                (click)="loadMore()"
            >
                @if (isLoading()) {
                    <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-orange-500 border-t-transparent"></span>
                    <span>جاري التحميل...</span>
                } @else {
                    <span>عرض المزيد من المطاعم</span>
                    <span class="material-symbols-sharp select-none text-[20px] leading-none text-orange-500 transition-transform duration-200 group-hover:translate-y-0.5">
                        expand_more
                    </span>
                }
            </button>
        </div>
    }

</section>
