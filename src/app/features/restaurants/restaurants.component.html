<section dir="rtl" class="mx-auto px-8 pt-4  bg-white">

    <!-- Header -->

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-gray-900">
            {{ title() }}
        </h1>

        <p class="mt-1 text-sm text-gray-500">
            اكتشف المطاعم المتاحة
        </p>

    </div>


    <!-- Restaurants Grid -->

    <div class="grid grid-cols-[repeat(auto-fit,minmax(220px,1fr))] gap-3">

        @for (restaurant of restaurants(); track restaurant.id ) {

        <app-restaurant-item [restaurant]="restaurant" />

        }
    </div>

    @if (restaurants().length === 0 && isLoading()) {
        <p class="py-12 text-center text-sm text-gray-500">جاري تحميل المطاعم...</p>
    } @else if (restaurants().length === 0) {
        <p class="py-12 text-center text-sm text-gray-500">لا توجد مطاعم متاحة حاليًا</p>
    }

    @if (restaurants().length > 0 && hasMore()) {
        <div class="mt-6 flex justify-start">
            <button
                type="button"
                class="rounded-md bg-orange-500 px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-60"
                [disabled]="isLoading()"
                (click)="loadMore()"
            >
                {{ isLoading() ? 'جاري التحميل...' : 'عرض المزيد' }}
            </button>
        </div>
    }

</section>
