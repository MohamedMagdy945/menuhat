<form [formGroup]="form" (ngSubmit)="submit()">

  <!-- Account Info -->

  <h3 class="mt-3 text-13 font-bold text-[#262b31]">
    معلومات الحساب
  </h3>

  <div class="grid grid-cols-2 gap-x-5 gap-y-[8px] max-[480px]:grid-cols-1">

    <!-- Full Name -->
    <app-form-input formControlName="fullName" label="الاسم الكامل" placeholder="أدخل الاسم الكامل">
      <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
        <path
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </app-form-input>


    <!-- Username -->
    <app-form-input formControlName="username" label="اسم المستخدم" placeholder="أدخل اسم المستخدم">
      <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
      </svg>
    </app-form-input>


    <!-- Email -->
    <app-form-input formControlName="email" label="البريد الإلكتروني" placeholder="أدخل بريدك الإلكتروني" type="email">
      <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
        <path
          d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
      </svg>
    </app-form-input>


    <!-- Password -->
    <app-form-input formControlName="password" label="كلمة المرور" placeholder="أدخل كلمة المرور" type="password">
      <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
        <path
          d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-0.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
      </svg>
    </app-form-input>


    <!-- Confirm Password -->
    <div class="col-span-full min-w-0 max-[480px]:col-auto">

      <app-form-input formControlName="confirmPassword" label="تأكيد كلمة المرور" placeholder="أعد إدخال كلمة المرور"
        type="password">
        <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
          <path
            d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 3.1 3.1 3.1v2z" />
        </svg>
      </app-form-input>

    </div>

  </div>


  <!-- Restaurant Info -->
  <div>

    <h3 class="mt-5px text-[14px] font-bold text-[#262b31]">
      معلومات المطعم
    </h3>

    <div class="grid grid-cols-2 gap-x-5 gap-y-8px max-480px:grid-cols-1">

      <!-- Restaurant Name -->
      <app-form-input formControlName="restaurantName" label="اسم المطعم" placeholder="أدخل اسم المطعم">
        <svg input-icon class="h-3 w-4 fill-current" viewBox="0 0 24 24">
          <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z" />
        </svg>
      </app-form-input>


      <!-- Restaurant Type -->
      <div class="min-w-0">

        <label class="mb-[6px] block text-[12px] font-semibold text-[#30353b]">
          نوع المطعم
        </label>

        <div class="relative w-full">

          <select formControlName="restaurantType"
            class="box-border h-[39px] w-full cursor-pointer appearance-none rounded-[4px] border border-[#e2e6ea] bg-white px-3 pl-10 text-[10px] text-[#353a40] outline-none transition duration-200 focus:border-[#ff6900] focus:ring-2 focus:ring-[rgba(255,105,0,0.08)]">

            <option value="" disabled>
              اختر نوع المطعم
            </option>

            <option value="restaurant">
              مطعم
            </option>

            <option value="cafe">
              كافيه
            </option>

            <option value="sweets">
              حلويات
            </option>

            <option value="bakery">
              مخبوزات
            </option>

            <option value="fastfood">
              وجبات سريعة
            </option>

          </select>

          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[#89919a]">
            <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24">
              <path d="M7 10l5 5 5-5z" />
            </svg>
          </span>

        </div>

      </div>


      <!-- Phone -->
      <app-form-input formControlName="phone" label="رقم الهاتف" placeholder="أدخل رقم الهاتف" type="tel">
        <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
          <path
            d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
        </svg>
      </app-form-input>


      <!-- City -->
      <app-form-select formControlName="city" label="المدينة" placeholder="اختر المدينة" [options]="cities">
      </app-form-select>

      <!-- Address -->

      <app-form-input formControlName="address" label="العنوان" placeholder="أدخل عنوان المطعم">
        <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
        </svg>
      </app-form-input>


    </div>

  </div>


  <!-- Submit -->
  <button type="submit"
    class="h-10 w-full mt-3 cursor-pointer rounded-[5px] border-0 bg-[#ff6900] text-[12px] font-bold text-white transition duration-200 hover:bg-[#f45f00] active:scale-[0.995]">
    إنشاء حساب المطعم
  </button>

</form>
