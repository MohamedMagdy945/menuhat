<div class="mx-auto my-auto w-full max-w-2xl rounded-2xl border border-gray-100 bg-white p-6 shadow-xl max-sm:p-4">
  
  <!-- Form Container بارتفاع ثابت وشريط تمرير أنيق -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="custom-scrollbar flex h-[580px] flex-col justify-between overflow-y-auto px-1 py-1 max-sm:h-[500px]">
    
    <div class="space-y-6">
      
      <!-- قسم معلومات الحساب -->
      <div>
        <h3 class="mb-3 text-xs font-bold uppercase tracking-wider text-[#89919a]">
          معلومات الحساب
        </h3>

        <div class="grid grid-cols-2 gap-4 max-[520px]:grid-cols-1">

          <!-- Full Name -->
          <app-form-input formControlName="fullName" label="الاسم بالكامل" placeholder="أدخل الاسم بالكامل">
            <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
          </app-form-input>

          <!-- Username -->
          <app-form-input formControlName="username" label="اسم المستخدم" placeholder="أدخل اسم المستخدم">
            <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
            </svg>
          </app-form-input>

          <!-- Password -->
          <app-form-input formControlName="password" label="كلمة المرور" placeholder="أدخل كلمة المرور" type="password" autocomplete="new-password">
            <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
            </svg>
          </app-form-input>

          <!-- Confirm Password -->
          <app-form-input formControlName="confirmPassword" label="تأكيد كلمة المرور" placeholder="أعد إدخال كلمة المرور" type="password" autocomplete="new-password">
            <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
            </svg>
          </app-form-input>

        </div>
      </div>

      <hr class="border-gray-100" />

      <!-- قسم معلومات الموقع -->
      <div>
        <h3 class="mb-3 text-xs font-bold uppercase tracking-wider text-[#89919a]">
          معلومات الموقع
        </h3>

        <div class="grid grid-cols-2 gap-4 max-[520px]:grid-cols-1">

          <!-- Governorate / Governorate Select -->
          <app-form-select 
          [disabled]="isLoadingGovernorates"
          (change)="onGovernorateChange($event)"
          formControlName="governmentId" 
          label="المحافظة" 
          [placeholder]="isLoadingGovernorates ? 'جاري تحميل المحافظات...' : 'اختر المحافظة'"           
          [options]="governorates">
          </app-form-select>

          <!-- City Select -->
          <app-form-select 
          [disabled]="isLoadingCities"
          formControlName="cityId" 
          label="المدينة" 
          [placeholder]="isLoadingCities ? 'جاري تحميل المدن...' : 'اختر المدينة'" 
          [options]="cities">
          </app-form-select>

          <!-- Address -->
          <div class="col-span-full">
            <app-form-input formControlName="address" label="العنوان" placeholder="أدخل المنطقة والشارع بالتفصيل">
              <svg input-icon class="h-4 w-4 fill-current" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
              </svg>
            </app-form-input>
          </div>

        </div>
      </div>

    </div>

    <!-- Submit Button (يثبت دائماً بالأسفل) -->
    <div class="sticky bottom-0 bg-white pt-4">
      <button 
        type="submit" 
        class="flex h-11 w-full items-center justify-center rounded-lg bg-[#ff6900] text-sm font-bold text-white shadow-md shadow-orange-500/10 transition-all duration-200 hover:bg-[#f45f00] hover:shadow-lg hover:shadow-orange-500/20 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60">
        إنشاء الحساب
      </button>
    </div>

  </form>
</div>
