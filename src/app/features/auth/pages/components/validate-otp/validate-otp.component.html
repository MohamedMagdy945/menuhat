
<div class="otp-container">
  <!-- الشعار أعلى الصفحة -->
  <div class="logo-container">
    <img src="/images/MenuhatLogo.png" alt="Menuhat Logo">
  </div>

  <div class="card">
    <h1 class="title">تأكيد رمز التحقق</h1>

   <div class="otp-inputs">
  <input 
    *ngFor="let digit of otpDigits; let i = index; trackBy: trackByIndex" 
    type="text" 
    inputmode="numeric"
    maxLength="6"
    class="otp-field"
    [id]="'otp-input-' + i"
    [value]="otpDigits[i]"
    (input)="onOtpInput($event, i)"
    (keydown)="onOtpKeyDown($event, i)"
    (focus)="$any($event.target).select()"
  >
</div>

    <p class="subtitle">تم إرسال رمز التحقق إلى بريدك الإلكتروني</p>

    <button type="button" class="btn-primary" [disabled]="isLoading" (click)="onVerifyCode()">
      <span *ngIf="!isLoading">تأكيد الرمز</span>
      <span *ngIf="isLoading">جاري التحقق...</span>
    </button>

    <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

    <div class="resend-section">
      <p *ngIf="timeLeft > 0" class="timer-text">
  إعادة إرسال الرمز خلال 
  <span class="timer-count">
    00:{{ timeLeft < 10 ? '0' + timeLeft : timeLeft }}
  </span>
</p>

<button *ngIf="timeLeft === 0" type="button" class="resend-btn" (click)="resendCode()">
  إعادة إرسال الرمز
</button>
      <p class="change-email">
        أدخلت بريداً خاطئاً؟ <a (click)="changeEmail()">تغيير البريد</a>
      </p>
    </div>
  </div>
</div>
