<div class="w-full flex items-center justify-center py-2 sm:py-4">
  <!-- Centered Card -->
  <div
    class="relative z-10 mx-auto flex w-full max-w-110 flex-col rounded-3xl border border-gray-200 bg-white p-6 sm:p-8">
    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center">
      <a routerLink="/" class="inline-block transition-transform duration-200" aria-label="Menuhat Home">
        <img src="/icons/menuhat-logo.svg" alt="Menuhat Logo" class="h-15 w-auto object-contain" />
      </a>
      <h1 class="mt-4 text-xl font-bold tracking-tight text-slate-900">
        {{ role === 'owner' ? 'تسجيل حساب صاحب مطعم' : 'إنشاء حساب جديد' }}
      </h1>
      <p class="mt-1 font-semibold text-xs sm:text-sm text-gray-400">
        {{ role === 'owner' ? 'أدخل بريدك الإلكتروني لتلقي رمز التحقق ومتابعة تسجيل مطعمك' : 'أدخل بريدك الإلكتروني لتلقي رمز التحقق ومتابعة التسجيل' }}
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSendCode()" class="mt-6 w-full">
      <!-- Email Field -->
      <app-form-input
        formControlName="email"
        label="البريد الإلكتروني"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        [customErrors]="validationMessages.email"
      >
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          mail
        </span>
      </app-form-input>

      <!-- Submit Button -->
      <app-loading-button
        type="submit"
        text="إرسال رمز التحقق"
        loadingText="جاري الإرسال..."
        [loading]="isLoading()"
        [disabled]="signupForm.invalid || isLoading()"
        [fullWidth]="true"
      />
    </form>

    <!-- Login Prompt -->
    <div class="mt-6 flex items-center justify-center gap-1.5 text-sm">
      <span class="text-slate-500">لديك حساب بالفعل؟</span>
      <a
        routerLink="/login"
        class="group inline-flex items-center gap-1 font-bold text-orange-600 no-underline transition-all duration-200 hover:text-orange-700 hover:underline"
      >
        <span>تسجيل الدخول</span>
        <span
          class="material-symbols-sharp select-none leading-none text-[16px] transition-transform duration-200 group-hover:-translate-x-1"
        >
          arrow_back
        </span>
      </a>
    </div>
  </div>
</div>
