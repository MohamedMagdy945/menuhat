<div class="signup-container">
  <!-- الشعار أعلى الصفحة -->
  <div class="logo-container">
    <img src="/images/MenuhatLogo.png" alt="Menuhat Logo">
  </div>

  <!-- الكارت -->
  <div class="card">
    <h1 class="title">إنشاء حساب جديد</h1>

    <form [formGroup]="signupForm" (ngSubmit)="onSendCode()">
      <div class="form-group">
        <label class="label" for="email">البريد الإلكتروني</label>
        <input 
          id="email"
          type="email" 
          formControlName="email"
          class="input-field" 
          [class.is-invalid]="emailControl?.invalid && emailControl?.touched"
          placeholder="أدخل بريدك الإلكتروني"
        >
        <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-message">
          <span *ngIf="emailControl?.errors?.['required']">البريد الإلكتروني مطلوب</span>
          <span *ngIf="emailControl?.errors?.['email']">يرجى إدخال بريد إلكتروني صحيح</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="signupForm.invalid">
        إرسال رمز التحقق
      </button>
    </form>

    <div class="login-text">
      لديك حساب بالفعل؟ <a routerLink="/login">تسجيل الدخول</a>
    </div>
  </div>
</div>
