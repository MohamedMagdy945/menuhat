<div class="relative flex min-h-screen w-full items-center justify-center overflow-hidden px-4 ">

  <!-- Centered Login Card -->
  <div class="relative z-10 mx-auto flex w-full max-w-110 flex-col rounded-[20px] border border-slate-200/85 bg-white p-5 sm:rounded-xl sm:px-8 sm:py-10">
    <!-- Brand Header with Centered Logo -->
    <div class="mb-6.5 flex flex-col items-center text-center">
      <a routerLink="/" class="mb-4.5 inline-block transition-transform duration-250 ease-out hover:-translate-y-0.5" aria-label="Menuhat Home">
        <img src="/images/login.png" alt="Menuhat Logo" class="h-50 w-auto object-contain" />
      </a>

      <h1 class="m-0 mb-1.5 text-[22px] sm:text-2xl font-extrabold tracking-tight text-slate-900">تسجيل الدخول</h1>
      <p class="m-0 max-w-[320px] text-[13.5px] leading-relaxed text-slate-500">
        سجّل دخولك لمتابعة طلباتك واكتشاف أشهى الوجبات
      </p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full">
      <!-- Email / Mobile Field -->
      <app-form-input
        formControlName="mobile"
        label="البريد الإلكتروني أو رقم الهاتف"
        placeholder="example@email.com أو 01xxxxxxxxx"
        autocomplete="username"
        [customErrors]="validationMessages.mobile"
      >
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          mail
        </span>
      </app-form-input>

      <!-- Password Field -->
      <app-form-input
        formControlName="password"
        label="كلمة المرور"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        [customErrors]="validationMessages.password"
      >
        <a label-extra routerLink="/sendEmail" class="text-[13px] font-semibold text-orange-600 no-underline transition-colors duration-200 hover:text-orange-700 hover:underline">
          نسيت كلمة المرور؟
        </a>
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          lock
        </span>
      </app-form-input>

      <!-- Submit Button -->
      <app-loading-button
        type="submit"
        text="تسجيل الدخول"
        loadingText="جاري تسجيل الدخول..."
        [loading]="isLoading"
        [disabled]="loginForm.invalid || isLoading"
        [fullWidth]="true"
      />
    </form>

    <!-- Divider -->
    <div class="relative my-4.5 mt-5.5 flex items-center justify-center before:h-px before:flex-1 before:bg-slate-200 after:h-px after:flex-1 after:bg-slate-200">
      <span class="bg-white px-3 text-[12.5px] font-medium text-slate-400">أو المتابعة بواسطة</span>
    </div>

    <!-- Social Login: Google -->
    <button
      type="button"
      class="flex h-12 w-full cursor-pointer items-center justify-center gap-3 rounded-[14px] border border-slate-200 bg-white text-sm font-semibold text-slate-700 transition-all duration-200 hover:-translate-y-0.5 hover:border-slate-300 hover:bg-slate-50 hover:shadow-[0_4px_12px_rgba(15,23,42,0.05)]"
      (click)="loginWithGoogle()"
      aria-label="تسجيل الدخول بواسطة Google"
    >
      <span class="material-symbols-sharp select-none leading-none text-[20px]">
        login
      </span>
      <span>المتابعة باستخدام Google</span>
    </button>

    <!-- Signup Prompt -->
    <div class="mt-5.5 flex items-center justify-center gap-2 text-sm">
      <span class="text-slate-500">ليس لديك حساب؟</span>
      <a routerLink="/sendEmail" class="group inline-flex items-center gap-1 font-bold text-orange-600 no-underline transition-all duration-200 hover:text-orange-700 hover:underline">
        <span>إنشاء حساب جديد</span>
        <span class="material-symbols-sharp select-none leading-none text-[16px] transition-transform duration-200 group-hover:-translate-x-1">
          arrow_back
        </span>
      </a>
    </div>
  </div>
</div>
