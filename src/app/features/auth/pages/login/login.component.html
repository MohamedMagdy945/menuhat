<div class="auth-page-wrapper" dir="rtl">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <!-- Centered Login Card -->
  <div class="auth-card">
    <!-- Brand Header with Centered Logo -->
    <div class="brand-header">
      <a routerLink="/" class="logo-link" aria-label="Menuhat Home">
        <img src="/icons/menuhat-logo.svg" alt="Menuhat Logo" class="brand-logo" />
      </a>
      <div class="welcome-chip">
        <span class="pulse-dot"></span>
        <span>مرحباً بك مجدداً 👋</span>
      </div>
      <h1 class="auth-title">تسجيل الدخول</h1>
      <p class="auth-subtitle">
        سجّل دخولك لمتابعة طلباتك واكتشاف أشهى الوجبات
      </p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email / Mobile Field -->
      <app-form-input
        formControlName="mobile"
        label="البريد الإلكتروني أو رقم الهاتف"
        placeholder="example@email.com أو 01xxxxxxxxx"
        autocomplete="username"
        [customErrors]="validationMessages.mobile"
      >
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          mail
        </span>
      </app-form-input>

      <!-- Password Field -->
      <app-form-input
        formControlName="password"
        label="كلمة المرور"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
        [customErrors]="validationMessages.password"
      >
        <a label-extra routerLink="/sendEmail" class="forgot-link">
          نسيت كلمة المرور؟
        </a>
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          lock
        </span>
      </app-form-input>

      <!-- Submit Button -->
      <app-loading-button
        type="submit"
        text="تسجيل الدخول"
        loadingText="جاري تسجيل الدخول..."
        [loading]="isLoading"
        [disabled]="loginForm.invalid || isLoading"
        [fullWidth]="true"
      />
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>أو المتابعة بواسطة</span>
    </div>

    <!-- Social Login: Google -->
    <button
      type="button"
      class="google-btn"
      (click)="loginWithGoogle()"
      aria-label="تسجيل الدخول بواسطة Google"
    >
      <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
        <path
          fill="#4285F4"
          d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"
        />
        <path
          fill="#34A853"
          d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.1 0-5.73-2.1-6.67-4.93H1.37v3.15C3.35 21.32 7.39 24 12 24z"
        />
        <path
          fill="#FBBC05"
          d="M5.33 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.37A11.95 11.95 0 0 0 0 12c0 1.92.46 3.74 1.37 5.42l3.96-3.15z"
        />
        <path
          fill="#EA4335"
          d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.39 0 3.35 2.68 1.37 6.58l3.96 3.15c.94-2.83 3.57-4.98 6.67-4.98z"
        />
      </svg>
      <span class="google-btn-text">المتابعة باستخدام Google</span>
    </button>

    <!-- Signup Prompt -->
    <div class="signup-prompt">
      <span class="prompt-text">ليس لديك حساب؟</span>
      <a routerLink="/sendEmail" class="create-account-link">
        <span>إنشاء حساب جديد</span>
        <span class="material-symbols-sharp select-none leading-none text-[16px]">
          arrow_back
        </span>
      </a>
    </div>
  </div>
</div>
