<div class="w-full flex items-center justify-center py-2 sm:py-4">
  <!-- Centered Login Card -->
  <div
    class="relative z-10 mx-auto flex w-full max-w-110 flex-col rounded-3xl border border-gray-100 bg-white p-6 sm:p-8 ">
    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center">
      <a routerLink="/" class="inline-block transition-transform duration-200 " aria-label="Menuhat Home">
        <img src="/icons/menuhat-logo.svg" alt="Menuhat Logo" class="h-16 w-auto object-contain" />
      </a>
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900">تسجيل الدخول</h1>
      <p class="mt-1 font-semibold text-xs sm:text-sm text-gray-400">أهلاً بك، سجّل دخولك لمتابعة طلباتك</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-6 w-full">
      <!-- Email / Mobile Field -->
      <app-form-input formControlName="mobile" label="البريد الإلكتروني أو رقم الهاتف"
        placeholder="example@email.com أو 01xxxxxxxxx" autocomplete="username"
        [customErrors]="validationMessages.mobile">
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          mail
        </span>
      </app-form-input>

      <!-- Password Field -->
      <app-form-input formControlName="password" label="كلمة المرور" type="password" placeholder="••••••••"
        autocomplete="current-password" [customErrors]="validationMessages.password">
        <a label-extra routerLink="/send-email"
          class="text-[13px] font-semibold text-orange-600 no-underline transition-colors duration-200 hover:text-orange-700 hover:underline">
          نسيت كلمة المرور؟
        </a>
        <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]">
          lock
        </span>
      </app-form-input>

      <!-- Error Message Banner (Under Password Field) -->
      @if (errorMessage()) {
      <div
        class="login-error-alert -mt-1 mb-4 flex items-center gap-2.5 rounded-2xl border border-red-200 bg-red-50/90 px-3.5 py-3  text-red-700"
        role="alert">
        <span class="material-symbols-sharp shrink-0 select-none text-[20px] text-red-500">
          error
        </span>
        <span class="flex-1 text-xs sm:text-sm font-medium leading-relaxed">{{ errorMessage() }}</span>
      </div>
      }

      <!-- Submit Button -->
      <app-loading-button type="submit" text="تسجيل الدخول" loadingText="جاري تسجيل الدخول..." [loading]="isLoading()"
        [disabled]="loginForm.invalid || isLoading()" [fullWidth]="true" />
    </form>

    <!-- Divider -->
    <div
      class="relative my-5 flex items-center justify-center before:h-px before:flex-1 before:bg-slate-200 after:h-px after:flex-1 after:bg-slate-200">
      <span class="bg-white px-3 text-xs font-medium text-slate-400">أو المتابعة بواسطة</span>
    </div>

    <!-- Social Login: Google -->
    <button type="button"
      class="flex h-12 w-full cursor-pointer items-center justify-center gap-2.5 rounded-[25px] border border-slate-200 bg-white text-sm font-semibold text-slate-700 transition-all duration-200  hover:bg-slate-50"
      (click)="loginWithGoogle()" aria-label="تسجيل الدخول بواسطة Google">
      <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4"
          d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
        <path fill="#34A853"
          d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.1 0-5.73-2.1-6.67-4.93H1.37v3.15C3.35 21.32 7.39 24 12 24z" />
        <path fill="#FBBC05"
          d="M5.33 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.37A11.95 11.95 0 0 0 0 12c0 1.92.46 3.74 1.37 5.42l3.96-3.15z" />
        <path fill="#EA4335"
          d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.39 0 3.35 2.68 1.37 6.58l3.96 3.15c.94-2.83 3.57-4.98 6.67-4.98z" />
      </svg>
      <span>المتابعة باستخدام Google</span>
    </button>

    <!-- Signup Prompt -->
    <div class="mt-6 flex flex-col items-center justify-center  gap-2.5 pt-4 border-t border-slate-100 text-sm">
      <div class="flex items-center justify-center gap-1.5 text-slate-500">
        <span>ليس لديك حساب؟</span>
        <a [routerLink]="['/send-email']" [queryParams]="{ role: 'customer' }"
          class="group inline-flex items-center gap-1 font-bold text-orange-600 ">
          <span>سجل كعميل</span>
          <span class="material-symbols-sharp select-none leading-none text-[16px] ">
            arrow_back
          </span>
        </a>
      </div>

      <div class="flex items-center justify-center gap-1.5 text-sm text-slate-400">
        <span>أو</span>
        <a [routerLink]="['/send-email']" [queryParams]="{ role: 'owner' }"
          class="group inline-flex items-center gap-1 font-bold text-orange-600">
          <span>سجل كصاحب مطعم</span>
          <span class="material-symbols-sharp select-none leading-none text-[14px] ">
            arrow_back
          </span>
        </a>
      </div>
    </div>
  </div>
</div>
