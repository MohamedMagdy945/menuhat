<div class="bg-white rounded-2xl p-4 border border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
  <!-- تفاصيل الطلب والصورة -->
  <div class="flex items-center gap-3.5 min-w-0">
    <img 
      [src]="logoUrl"
      (error)="$any($event.target).src = '/images/default.png'"
      [alt]="order().clientName ?? 'صورة المطعم'" 
      class="w-14 h-14 rounded-xl object-cover border border-slate-100 shrink-0"
    />

    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs text-slate-400 font-medium">طلب #{{ order().serialOrder }}</span>
        <span 
          class="text-[11px] px-2.5 py-0.5 rounded-full font-semibold"
          [ngClass]="{
            'bg-amber-50 text-amber-700 border border-amber-200': order().orderStatusId === 0,
            'bg-blue-50 text-blue-700 border border-blue-200': order().orderStatusId === 1,
            'bg-orange-50 text-orange-600 border border-orange-200': order().orderStatusId === 2,
            'bg-emerald-50 text-emerald-600 border border-emerald-200': order().orderStatusId === 3,
            'bg-rose-50 text-rose-600 border border-rose-200': order().orderStatusId === 4
          }"
        >
          {{ order().orderStatusName_Ar }}
        </span>
      </div>

      <h2 class="text-sm sm:text-base font-bold text-slate-800 truncate mb-1">
        {{ order().clientName?.trim() || 'لا يوجد اسم لهذا المطعم' }}
      </h2>

      <div class="flex items-center gap-2 text-xs text-slate-400">
        <span>{{ order().orderDate }}</span>
        @if (order().orderTotal) {
          <span>•</span>
          <span class="font-bold text-slate-700">{{ order().orderTotal | number }} ج.م</span>
        }
      </div>
    </div>
  </div>

  <!-- الأزرار (بدون أي تأثيرات hover) -->
  <div class="flex items-center gap-2 shrink-0">
    <button 
      type="button"
      (click)="onCancel()"
      class="border border-slate-200 text-slate-600 py-2 px-4 rounded-xl text-xs font-medium cursor-pointer"
    >
      إلغاء الطلب
    </button>
    <button 
      type="button"
      (click)="onView()"
      class="bg-orange-500 text-white font-bold py-2 px-4 rounded-xl text-xs cursor-pointer"
    >
      عرض التفاصيل
    </button>
  </div>
</div>
