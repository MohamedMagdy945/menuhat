<div class="space-y-3">
  <div>
    <label class="block text-xs font-semibold text-slate-700 mb-1.5"
      >المحافظة <span class="text-red-500">*</span></label
    >
    <select
      [ngModel]="governmentId()"
      (ngModelChange)="onGovernmentChange($event)"
      [disabled]="isSaving()"
      class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-slate-800 focus:outline-none focus:border-orange-500 bg-white"
    >
      <option [ngValue]="null" disabled>اختر المحافظة</option>
      @for (gov of governments(); track gov.id) {
        <option [ngValue]="gov.id">{{ gov.name }}</option>
      }
    </select>
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-700 mb-1.5"
      >المدينة <span class="text-red-500">*</span></label
    >
    <select
      [ngModel]="cityId()"
      (ngModelChange)="onCityChange($event)"
      [disabled]="isSaving() || !governmentId()"
      class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-slate-800 focus:outline-none focus:border-orange-500 bg-white disabled:bg-slate-50"
    >
      <option [ngValue]="null" disabled>اختر المدينة</option>
      @for (city of cities(); track city.id) {
        <option [ngValue]="city.id">{{ city.name }}</option>
      }
    </select>
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-700 mb-1.5"
      >العنوان بالتفصيل <span class="text-red-500">*</span></label
    >
    <input
      type="text"
      [ngModel]="addressText()"
      (ngModelChange)="addressText.set($event)"
      (keydown.enter)="save()"
      [disabled]="isSaving()"
      placeholder="الشارع، رقم المبنى، الدور، الشقة"
      class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-slate-800 focus:outline-none focus:border-orange-500 bg-white"
    />
  </div>

  <div class="flex items-center gap-2 pt-1">
    <button
      type="button"
      (click)="save()"
      [disabled]="!canSave()"
      class="flex-1 py-2.5 rounded-xl bg-orange-500 text-white font-semibold text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
    >
      @if (isSaving()) {
        <span
          class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
        ></span>
      }
      <span>{{ isEdit() ? 'حفظ التعديلات' : 'حفظ العنوان' }}</span>
    </button>
    @if (cancellable()) {
      <button
        type="button"
        (click)="cancel()"
        [disabled]="isSaving()"
        class="px-4 py-2.5 rounded-xl bg-white border border-gray-200 text-slate-700 font-semibold text-sm cursor-pointer"
      >
        إلغاء
      </button>
    }
  </div>
</div>
