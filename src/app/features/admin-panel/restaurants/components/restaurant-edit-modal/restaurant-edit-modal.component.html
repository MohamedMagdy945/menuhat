<div
  class="fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center sm:p-4"
  (click)="close()"
>
  <div
    class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col overflow-hidden"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-label="تعديل المطعم"
  >
    <!-- Header -->
    <div class="flex items-center justify-between gap-3 px-5 pt-5 pb-3 shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div
          class="w-9 h-9 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center shrink-0 border border-orange-100"
        >
          <span class="material-symbols-sharp text-[20px]">edit</span>
        </div>
        <div class="min-w-0">
          <h2 class="text-base font-semibold text-gray-900">تعديل المطعم</h2>
          <p class="text-xs text-slate-400 truncate">{{ menu().clientName }}</p>
        </div>
      </div>
      <button
        type="button"
        (click)="close()"
        class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center cursor-pointer shrink-0"
        aria-label="إغلاق"
      >
        <span class="material-symbols-sharp text-[18px]">close</span>
      </button>
    </div>

    <!-- Body -->
    <form
      [formGroup]="form"
      (ngSubmit)="save()"
      class="flex-1 overflow-y-auto px-5 pb-2"
      [class.opacity-60]="isLoading()"
    >
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
        <app-form-input formControlName="clientName" label="اسم المطعم" placeholder="اسم المطعم">
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >storefront</span
          >
        </app-form-input>

        <app-form-input
          formControlName="clientName_En"
          label="الاسم بالإنجليزية"
          placeholder="Restaurant name"
        >
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >translate</span
          >
        </app-form-input>

        <app-form-select
          formControlName="governmentId"
          label="المحافظة"
          placeholder="اختر المحافظة"
          [options]="governmentOptions()"
        >
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >map</span
          >
        </app-form-select>

        <app-form-select
          formControlName="cityId"
          label="المدينة"
          placeholder="اختر المدينة"
          [options]="cityOptions()"
        >
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >location_city</span
          >
        </app-form-select>

        <app-form-input formControlName="address" label="العنوان" placeholder="العنوان بالتفصيل">
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >location_on</span
          >
        </app-form-input>

        <app-form-input
          formControlName="address_En"
          label="العنوان بالإنجليزية"
          placeholder="Address"
        >
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >location_on</span
          >
        </app-form-input>

        <app-form-input formControlName="fromTime" label="يفتح من" type="time">
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >schedule</span
          >
        </app-form-input>

        <app-form-input formControlName="toTime" label="يغلق في" type="time">
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >schedule</span
          >
        </app-form-input>

        <app-form-select
          formControlName="orderConditionId"
          label="شروط الطلب"
          placeholder="اختر شرط الطلب"
          [options]="orderConditionOptions()"
        >
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >rule</span
          >
        </app-form-select>

        <app-form-input formControlName="notes" label="ملاحظات" placeholder="ملاحظات (اختياري)">
          <span input-icon class="material-symbols-sharp select-none leading-none text-[20px]"
            >sticky_note_2</span
          >
        </app-form-input>
      </div>
    </form>

    <!-- Footer -->
    <div class="flex items-center gap-2 p-4 shrink-0">
      <button
        type="button"
        (click)="save()"
        [disabled]="isSaving() || isLoading()"
        class="flex-1 bg-orange-500 text-white font-semibold text-sm px-5 py-3 rounded-xl cursor-pointer disabled:opacity-50 inline-flex items-center justify-center gap-2"
      >
        @if (isSaving()) {
          <span
            class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"
          ></span>
        }
        <span>حفظ التعديلات</span>
      </button>
      <button
        type="button"
        (click)="close()"
        class="bg-white border border-gray-200 text-slate-700 font-semibold text-sm px-5 py-3 rounded-xl cursor-pointer"
      >
        إلغاء
      </button>
    </div>
  </div>
</div>
