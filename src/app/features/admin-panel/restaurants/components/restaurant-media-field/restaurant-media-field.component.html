<div class="space-y-2">
  <div class="flex items-center justify-between gap-2">
    <p class="text-sm font-semibold text-slate-700">{{ label() }}</p>
    @if (hint()) {
      <span class="text-[11px] text-slate-400">{{ hint() }}</span>
    }
  </div>

  <div
    class="relative h-40 rounded-xl bg-slate-50 border border-dashed border-slate-200 overflow-hidden flex items-center justify-center"
  >
    @if (url()) {
      @if (isPdf()) {
        <div class="flex flex-col items-center gap-1.5 text-rose-500">
          <span class="material-symbols-sharp text-5xl">picture_as_pdf</span>
          <span class="text-xs font-semibold text-slate-600">ملف PDF</span>
        </div>
      } @else {
        <img
          [src]="url()"
          [alt]="label()"
          (error)="onImageError($event)"
          class="w-full h-full object-contain"
        />
      }
    } @else {
      <div class="flex flex-col items-center gap-1.5 text-slate-300">
        <span class="material-symbols-sharp text-4xl">{{ icon() }}</span>
        <span class="text-xs font-medium text-slate-400">لا يوجد ملف</span>
      </div>
    }

    @if (busy()) {
      <div class="absolute inset-0 bg-white/70 flex items-center justify-center">
        <span
          class="w-6 h-6 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"
        ></span>
      </div>
    }
  </div>

  <div class="flex items-center gap-2">
    <label
      class="flex-1 inline-flex items-center justify-center gap-1.5 bg-white border border-gray-200 text-slate-700 font-semibold text-sm px-3 py-2 rounded-xl cursor-pointer"
      [class.opacity-50]="busy() || disabled()"
      [class.pointer-events-none]="busy() || disabled()"
    >
      <span class="material-symbols-sharp text-[18px] text-slate-500">upload</span>
      <span>{{ url() ? 'تغيير' : 'رفع ملف' }}</span>
      <input
        type="file"
        class="hidden"
        [accept]="accept()"
        [disabled]="busy() || disabled()"
        (change)="onFileChange($event)"
      />
    </label>

    @if (canOpen()) {
      <a
        [href]="url()"
        target="_blank"
        rel="noopener"
        class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0"
        title="فتح"
        aria-label="فتح الملف"
      >
        <span class="material-symbols-sharp text-[18px]">open_in_new</span>
      </a>
    }

    @if (url()) {
      <button
        type="button"
        (click)="remove.emit()"
        [disabled]="busy() || disabled()"
        class="w-9 h-9 rounded-xl bg-red-50 text-red-500 flex items-center justify-center cursor-pointer shrink-0 disabled:opacity-50"
        title="حذف"
        aria-label="حذف الملف"
      >
        <span class="material-symbols-sharp text-[18px]">delete</span>
      </button>
    }
  </div>
</div>
