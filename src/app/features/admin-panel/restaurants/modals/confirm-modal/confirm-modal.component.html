@if (rendered()) {
  @let c = content();
  <div
    class="cm-backdrop fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center sm:p-4"
    [class.cm-closing]="closing()"
    (click)="cancel()"
  >
    <div
      class="cm-panel bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl shadow-xl p-5 sm:p-6 text-center"
      (click)="$event.stopPropagation()"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="c.title"
    >
      <div
        class="mx-auto w-14 h-14 rounded-full flex items-center justify-center"
        [class]="isDanger() ? 'bg-red-50 text-red-500' : 'bg-orange-50 text-orange-500'"
      >
        <span class="material-symbols-sharp text-3xl">{{ c.icon }}</span>
      </div>

      <h2 class="mt-4 text-lg font-bold text-slate-900">{{ c.title }}</h2>
      @if (c.message) {
        <p class="mt-1.5 text-sm text-slate-500 leading-relaxed">{{ c.message }}</p>
      }

      <div class="mt-6 flex items-center gap-2">
        <button
          type="button"
          (click)="confirm()"
          [disabled]="loading()"
          class="flex-1 text-white font-bold text-sm px-5 py-3 rounded-xl cursor-pointer inline-flex items-center justify-center gap-2 disabled:opacity-60"
          [class]="isDanger() ? 'bg-red-500' : 'bg-orange-500'"
        >
          @if (loading()) {
            <span
              class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"
            ></span>
          }
          <span>{{ c.confirmText }}</span>
        </button>
        <button
          type="button"
          (click)="cancel()"
          [disabled]="loading()"
          class="flex-1 bg-white border border-gray-200 text-slate-700 font-semibold text-sm px-5 py-3 rounded-xl cursor-pointer disabled:opacity-60"
        >
          {{ c.cancelText }}
        </button>
      </div>
    </div>
  </div>
}
