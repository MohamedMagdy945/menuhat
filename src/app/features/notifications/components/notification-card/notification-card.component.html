<article (click)="onCardClick()"
  class="bg-white rounded-2xl shadow-xs border border-gray-100 px-4 py-3  flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-4 cursor-pointer">
  <!-- Right Part: Icon + Text Info -->
  <div class="flex items-center gap-3.5 min-w-0 flex-1">
    <!-- Icon or Photo -->
    @if (photoUrl()) {
    <div class="w-11 h-11 rounded-xl overflow-hidden bg-slate-100 shrink-0 border border-gray-100 self-center">
      <img [src]="photoUrl()" [alt]="title()" class="w-full h-full object-cover"
        (error)="$any($event.target).style.display='none'" />
    </div>
    } @else {
    <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 self-center" [ngClass]="statusConfig().bg">
      <div class="text-xl flex items-center justify-center leading-none"> 
        <span class="material-symbols-sharp  leading-none select-none" >
          {{ icon() }}
        </span>
      </div>
    </div>
    }

    <!-- Text Info -->
    <div class="min-w-0 text-right space-y-1 flex-1">
      <!-- Top Line: Order Number + Status Badge + Unread Dot -->
      <div class="flex items-center gap-2">
        @if (item().orderSerial) {
        <span class=" text-slate-400 font-medium">طلب #{{ item().orderSerial }}</span>
        }

        <span class="text-sm px-2 py-1 rounded-md font-semibold" [ngClass]="statusConfig().badgeBg">
          {{ statusConfig().label }}
        </span>

        @if (isUnread()) {
        <span class="w-2 h-2 rounded-full bg-orange-500 shrink-0"></span>
        }
      </div>

      <!-- Title -->
      <h3 class="font-semibold text-slate-800 truncate">
        {{ title() }}
      </h3>

      <!-- Description (Compact 1-line truncate) -->
      @if (description()) {
      <p class="text-sm font-semibold text-gray-600 truncate leading-relaxed">
        {{ description() }}
      </p>
      }
    </div>
  </div>

  <!-- Left Part: Action Buttons (Top) + Date / Time (Bottom Left) -->
  <div
    class="flex flex-col sm:items-end justify-between gap-2 shrink-0 self-stretch sm:self-auto border-t sm:border-t-0 pt-2 sm:pt-0 border-gray-100">
    <!-- Buttons -->
    <div class="flex items-center gap-2 justify-end">
      <button type="button" (click)="onViewClick($event)" title="عرض التفاصيل"
        class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center cursor-pointer">
        <span class="material-symbols-sharp text-[16px]">open_in_new</span>
      </button>

      @if (isUnread()) {
      <button type="button" (click)="onMarkRead($event)" title="تحديد كمقروء"
        class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center cursor-pointer">
        <span class="material-symbols-sharp text-[16px]">check</span>
      </button>
      }

      <button type="button" (click)="onDelete($event)" title="حذف الإشعار"
        class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center cursor-pointer">
        <span class="material-symbols-sharp text-[16px]">delete</span>
      </button>
    </div>

    <!-- Date & Time (Bottom Left) -->
    <div class="flex items-center gap-1 text-xs text-slate-400 justify-end">
      <span class="material-symbols-sharp text-[14px]">schedule</span>
      <span>{{ timeAgo() }}</span>
    </div>
  </div>
</article>
