<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-xs p-4" dir="rtl">
  <!-- Modal Card -->
  <div class="relative w-full max-w-md rounded-3xl bg-white p-6 sm:p-7 shadow-2xl border border-gray-100 flex flex-col items-center text-center select-none">
    
    <!-- Close Button (Top Left in RTL) -->
    <button
      type="button"
      (click)="close.emit()"
      class="absolute top-4.5 left-4.5 text-slate-400 text-xl cursor-pointer w-8 h-8 rounded-full flex items-center justify-center"
      aria-label="إغلاق">
      ✕
    </button>

    <!-- Success / Check Icon -->
    <div class="w-14 h-14 rounded-full bg-orange-50 border border-orange-100 flex items-center justify-center text-orange-500 mb-3.5 shrink-0">
      <span class="material-symbols-sharp text-3xl leading-none">check_circle</span>
    </div>

    <!-- Title -->
    <h3 class="font-bold text-lg sm:text-xl text-slate-900 leading-snug">
      تأكيد قبول الطلب
    </h3>

    <!-- Description -->
    <p class="text-xs sm:text-sm text-slate-500 mt-2 leading-relaxed">
      هل أنت متأكد من قبول الطلب رقم <span class="font-bold text-slate-900">{{ orderNumber() }}</span> للعميل <span class="font-bold text-slate-900">{{ customerName() }}</span> والبدء في تحضيره؟
    </p>

    <!-- Order Type Pill -->
    <div class="w-full my-4 py-2 px-4 rounded-full border border-orange-200 bg-orange-50/50 flex items-center justify-between text-xs font-bold text-orange-600">
      <span class="flex items-center gap-1.5">
        <span class="material-symbols-sharp text-base leading-none">two_wheeler</span>
        <span>{{ orderType() }}</span>
      </span>
      <span class="text-orange-400 font-normal text-[11px]">توصيل خارجي</span>
    </div>

    <!-- Delivery Fee Input Section -->
    <div class="w-full text-right">
      <div class="flex items-center justify-between text-xs font-semibold text-slate-700 mb-1.5">
        <span>رسوم التوصيل</span>
        <span class="text-slate-400 font-normal">(اختياري)</span>
      </div>

      <div class="relative flex items-center">
        <!-- Money Icon on Right -->
        <span class="material-symbols-sharp absolute right-3 text-slate-400 text-lg pointer-events-none">
          payments
        </span>

        <!-- Input Field -->
        <input
          type="number"
          step="0.5"
          [value]="deliveryFee()"
          (input)="onFeeChange($any($event.target).value)"
          placeholder="0.00"
          class="w-full bg-white border border-gray-200 rounded-2xl py-2.5 pr-9 pl-12 text-sm text-slate-800 text-left font-bold focus:outline-none focus:border-orange-500 shadow-xs" />

        <!-- Currency Label on Left -->
        <span class="absolute left-3.5 text-xs font-bold text-slate-400 pointer-events-none">
          ج.م
        </span>
      </div>

      <!-- Info Helper Text -->
      <p class="text-[11px] text-slate-400 mt-1.5 flex items-center gap-1">
        <span class="material-symbols-sharp text-xs text-orange-500 leading-none">info</span>
        <span>يتم إضافة المبلغ تلقائياً إلى إجمالي الفاتورة</span>
      </p>
    </div>

    <!-- Action Buttons (إلغاء / تأكيد) -->
    <div class="flex items-center gap-3 w-full mt-6">
      <!-- Cancel Button -->
      <button
        type="button"
        (click)="close.emit()"
        class="flex-1 py-3 px-4 rounded-2xl border border-gray-200 bg-white text-slate-600 font-bold text-sm text-center cursor-pointer">
        إلغاء
      </button>

      <!-- Confirm Button -->
      <button
        type="button"
        (click)="submit()"
        class="flex-1 py-3 px-4 rounded-2xl bg-orange-500 text-white font-bold text-sm text-center cursor-pointer flex items-center justify-center gap-1.5 shadow-xs">
        <span class="material-symbols-sharp text-base leading-none">check</span>
        <span>تأكيد</span>
      </button>
    </div>

  </div>
</div>
