<div
  class="bg-white rounded-2xl p-3 sm:px-6 border border-gray-100 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4 cursor-pointer select-none"
  [routerLink]="['/dashboard/orders', order().id]">

  <!-- Right Side in RTL: Customer Info, Status, Price -->
  <div class="flex items-center justify-between md:justify-start gap-4 sm:gap-6 lg:gap-8 flex-wrap">
    <!-- 1. Customer Info -->
    <div class="text-right w-36 sm:w-44 md:w-52 shrink-0">
      <h3
        class="font-semibold text-slate-800 leading-snug truncate"
        [title]="order().customerName">
        {{ order().customerName }}
      </h3>
      @if (order().orderNumber) {
      <p class="text-sm text-slate-400 font-medium mt-0.5 truncate" dir="ltr">
        {{ order().orderNumber }}
      </p>
      }
    </div>

    <!-- 2. Status Badge Pill -->
    <span
      class="px-3.5 py-1 rounded-full text-sm font-semibold shrink-0 {{ order().statusColor }}">
      {{ order().statusLabel }}
    </span>

    <!-- 3. Price -->
    <div class="font-bold text-orange-500 text-base sm:text-lg shrink-0">
      {{ order().formattedPrice || order().price }} ج.م
    </div>
  </div>

  <!-- Left Side in RTL: Action Buttons (قبول / رفض) & Date in Bottom Left -->
  <div class="flex flex-col items-end gap-2 shrink-0 pt-2 md:pt-0 border-t md:border-t-0 border-slate-50">
    <!-- Action Buttons (قبول / رفض) -->
    <div class="flex items-center gap-2.5">
      <!-- Accept Button (قبول) -->
      <button
        type="button"
        (click)="handleAccept($event)"
        class="py-2 px-5 sm:px-6 rounded-2xl border border-emerald-200 bg-emerald-50/70 text-emerald-600 font-bold text-sm text-center cursor-pointer">
        قبول
      </button>

      <!-- Reject Button (رفض) -->
      <button
        type="button"
        (click)="handleReject($event)"
        class="py-2 px-5 sm:px-6 rounded-2xl border border-rose-200 bg-rose-50/70 text-rose-500 font-bold text-sm text-center cursor-pointer">
        رفض
      </button>
    </div>

    <!-- Date & Time (Bottom Left) -->
    <div class="flex items-center gap-1.5 text-slate-400 text-xs font-medium">
      <span class="material-symbols-sharp text-sm text-slate-400 select-none">schedule</span>
      <span>{{ order().time }}</span>
    </div>
  </div>
</div>
