<div class="bg-white rounded-2xl border border-gray-100 shadow-xs p-4 sm:p-5 flex flex-col justify-between gap-4 select-none">
  <!-- Top Row: Name with orange vertical bar on right (in RTL), cutlery icon on left -->
  <div class="flex items-center justify-between gap-3">
    <!-- Dish Name with Accent Bar -->
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-1.5 h-5 rounded-full bg-orange-500 shrink-0 inline-block"></span>
      <h3 class="font-bold text-sm sm:text-base text-slate-800 truncate" [title]="item().name">
        {{ item().name }}
      </h3>
    </div>

    <!-- Cutlery Circular Icon -->
    <div class="w-8 h-8 rounded-full bg-orange-50 flex items-center justify-center shrink-0">
      <span class="material-symbols-sharp text-base text-orange-500 select-none">restaurant</span>
    </div>
  </div>

  <!-- 2-Column Details Grid inside Card -->
  <div class="grid grid-cols-2 gap-3 pt-1 border-t border-slate-50 text-right">
    <!-- Column 1 (Right in RTL): Main Category & Size -->
    <div class="space-y-3">
      <div>
        <span class="text-xs text-slate-400 font-medium block">القسم الرئيسي</span>
        <p class="text-xs sm:text-sm font-bold text-slate-700 mt-0.5 truncate">
          {{ item().mainCategory }}
        </p>
      </div>

      <div>
        <span class="text-xs text-slate-400 font-medium block">الحجم</span>
        <p class="text-xs sm:text-sm font-bold text-slate-700 mt-0.5">
          {{ item().size || 'نفر' }}
        </p>
      </div>
    </div>

    <!-- Column 2 (Left in RTL): Sub Category & Orders Count -->
    <div class="space-y-3">
      <div>
        <span class="text-xs text-slate-400 font-medium block">القسم الفرعي</span>
        <p class="text-xs sm:text-sm font-bold text-slate-700 mt-0.5 truncate">
          {{ item().subCategory }}
        </p>
      </div>

      <div>
        <span class="text-xs text-slate-400 font-medium block">عدد الطلبات</span>
        <p class="text-base sm:text-lg font-bold text-orange-500 mt-0.5">
          {{ item().ordersCount | number }}
        </p>
      </div>
    </div>
  </div>
</div>
