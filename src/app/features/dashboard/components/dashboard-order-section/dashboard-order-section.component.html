<div class="space-y-4">
  <!-- Section Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-slate-900">الطلبات الحالية</h2>
      <p class="text-xs text-slate-400 mt-0.5">متابعة أحدث طلبات الزبائن الواردة</p>
    </div>
    <a routerLink="/dashboard/orders"
      class="text-orange-500 font-bold text-sm cursor-pointer flex items-center gap-1">
      <span>عرض الكل</span>
      <span class="material-symbols-sharp text-sm">arrow_back</span>
    </a>
  </div>

  <!-- Orders List -->
  <div class="flex flex-col gap-2.5">
    @for (order of orders(); track order.id) {
    <app-dashboard-order-card [order]="order" />
    } @empty {
    <div class="p-8 text-center bg-white rounded-2xl border border-gray-100 shadow-sm">
      <span class="material-symbols-sharp text-4xl text-slate-300">receipt_long</span>
      <p class="text-sm font-bold text-slate-700 mt-2">لا توجد طلبات واردة حالياً</p>
      <p class="text-xs text-slate-400 mt-0.5">ستظهر الطلبات الجديدة هنا فور قيام العملاء بالطلب</p>
    </div>
    }
  </div>
</div>
