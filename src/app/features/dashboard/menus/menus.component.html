<div class="space-y-6 w-full" dir="rtl">

  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3.5">
      <div
        class="w-12 h-12 rounded-2xl bg-orange-50 border border-orange-100 flex items-center justify-center shrink-0 shadow-xs">
        <span class="material-symbols-sharp text-2xl text-orange-500">restaurant_menu</span>
      </div>
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">المنيو</h1>
          <span
            class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-orange-50 text-orange-600 border border-orange-100 shrink-0">
            {{ restaurant().name }}
          </span>
        </div>
        <p class="text-xs sm:text-sm text-slate-400 mt-0.5">متابعة وإدارة تفاصيل المنيو وإعدادات المطعم</p>
      </div>
    </div>

    <a routerLink="/dashboard"
      class="bg-white border border-gray-200 text-slate-700 font-semibold text-xs sm:text-sm px-4 py-2.5 rounded-xl cursor-pointer flex items-center gap-1.5 shadow-xs w-fit">
      <span class="material-symbols-sharp text-base text-slate-500">arrow_forward</span>
      <span>لوحة التحكم</span>
    </a>
  </div>

  <!-- Menu Card Component (Constrained to max-w-sm, aligned to right) -->
  <div class="w-full max-w-sm">
    <app-menu-card
      [restaurant]="restaurant()"
      (onViewDetails)="openDetails()" />
  </div>

</div>
