<a [routerLink]="menuItem().link" class="flex items-center gap-3 py-3">
  <!-- Photo -->
  <div class="w-14 h-13 shrink-0 rounded-xl bg-slate-100 overflow-hidden">
    <img
      [src]="imageUrl()"
      [alt]="menuItem().title"
      class="w-full h-full object-contain"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
    />
  </div>

  <!-- Product & Restaurant -->
  <div class="flex-1 min-w-0 flex flex-col gap-1">
    <span class="font-semibold text-slate-800 truncate">{{ menuItem().title }}</span>
    @if (menuItem().subtitle) {
      <span class="flex items-center gap-1 text-sm text-slate-400 min-w-0">
        <span class="material-symbols-sharp text-base leading-none select-none" aria-hidden="true"
          >storefront</span
        >
        <span class="truncate">{{ menuItem().subtitle }}</span>
      </span>
    }
  </div>

  <!-- Price -->
  @if (menuItem().price !== null) {
    <span class="shrink-0 text-sm font-bold text-orange-500"
      >{{ menuItem().price | number: '1.0-2' }} ج.م</span
    >
  }
</a>
