<a [routerLink]="restaurant().link" class="flex items-center gap-3 py-3">
  <!-- Logo -->
  <div class="w-16 h-16 shrink-0 rounded-xl bg-slate-100 overflow-hidden">
    <img
      [src]="imageUrl()"
      [alt]="restaurant().title"
      class="w-full h-full object-cover"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
    />
  </div>

  <!-- Name & Location -->
  <div class="flex-1 min-w-0 flex flex-col gap-1">
    <span class="font-semibold text-slate-800 truncate">{{ restaurant().title }}</span>
    @if (restaurant().subtitle) {
      <span class="flex items-center gap-1 text-sm text-slate-400 min-w-0">
        <span class="material-symbols-sharp text-base leading-none select-none" aria-hidden="true"
          >location_on</span
        >
        <span class="truncate">{{ restaurant().subtitle }}</span>
      </span>
    }
  </div>
</a>
